<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>switchboard</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --border: #2a2e3a;
  --text: #e0e0e0;
  --muted: #888;
  --accent: #5b8def;
  --green: #4caf50;
  --amber: #ff9800;
  --red: #f44336;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 1.5rem;
}
h1 { font-size: 1.4rem; margin: 0 0 1rem; }
h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; color: var(--muted); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
}
.card h3 { margin: 0 0 0.5rem; font-size: 1rem; }
.stat { display: flex; justify-content: space-between; padding: 0.2rem 0; }
.stat .k { color: var(--muted); }
.stat .v { font-variant-numeric: tabular-nums; }
.badge {
  display: inline-block;
  padding: 0.1rem 0.4rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge.open { background: var(--green); color: #fff; }
.badge.saturated { background: var(--amber); color: #fff; }
.badge.boxed, .badge.breaker, .badge.low_interactivity { background: var(--red); color: #fff; }
.badge.unknown { background: var(--muted); color: #fff; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
a { color: var(--accent); }
.form-row { margin: 0.5rem 0; }
.form-row label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.2rem; }
.form-row input, .form-row select {
  width: 100%;
  padding: 0.4rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
}
button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 4px;
  cursor: pointer;
}
.mini-btn {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 0.2rem 0.5rem;
  font-size: 0.78rem;
}
.mini-btn:hover { color: var(--red); border-color: var(--red); }
.section-title {
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0.8rem 0 0.3rem;
  border-top: 1px solid var(--border);
  padding-top: 0.6rem;
}
.token-val { font-weight: 600; }
.token-warn { color: var(--amber); }
.token-crit { color: var(--red); }
</style>
</head>
<body>
<h1>switchboard</h1>
<div id="default-route"></div>
<div id="add-provider"></div>
<div id="route-add"></div>
<div id="model-add"></div>
<div id="routing-config-editor"></div>
<div id="app">Loading...</div>
<script>
// The default route is the only control on this page that WRITES, so it lives
// outside #app: the 5 s poll replaces #app wholesale and would wipe a
// half-typed edit. `editingDefault` additionally freezes this section while a
// form is open, so a poll landing mid-edit cannot discard what was typed.
let editingDefault = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function renderDefaultRoute(data) {
  if (editingDefault) return;
  const el = document.getElementById('default-route');
  const current = (data.route_table || {})['default'] || [];
  const known = Object.keys(data.providers || {}).sort();
  el.innerHTML = `
    <h2>Default Route</h2>
    <div class="card">
      <p style="margin:0 0 0.6rem;color:var(--muted);font-size:0.85rem">
        Where requests go when no route key matches, in preference order.
        A provider that no route names is never selected &mdash; the model map
        filters a route's candidates, it never adds to them.
      </p>
      <div class="stat">
        <span class="k">current</span>
        <span class="v">${current.length ? esc(current.join(' → ')) : '<em>none</em>'}</span>
      </div>
      <div style="margin-top:0.6rem">
        <button id="edit-default">Edit</button>
      </div>
    </div>`;
  document.getElementById('edit-default').onclick = () => {
    editingDefault = true;
    renderDefaultRouteForm(current, known);
  };
}

function renderDefaultRouteForm(current, known) {
  const el = document.getElementById('default-route');
  el.innerHTML = `
    <h2>Default Route</h2>
    <div class="card">
      <div class="form-row">
        <label for="default-input">
          Providers, comma-separated, most preferred first
        </label>
        <input id="default-input" list="known-providers"
               value="${esc(current.join(', '))}" autocomplete="off">
        <datalist id="known-providers">
          ${known.map(n => `<option value="${esc(n)}">`).join('')}
        </datalist>
      </div>
      <p style="margin:0.3rem 0 0.6rem;color:var(--muted);font-size:0.8rem">
        Configured: ${known.length ? known.map(esc).join(', ') : '<em>none</em>'}
      </p>
      <div id="default-error" style="color:var(--red);font-size:0.85rem;
           margin-bottom:0.5rem"></div>
      <button id="save-default">Save</button>
      <button id="cancel-default"
              style="background:transparent;border:1px solid var(--border)">
        Cancel
      </button>
    </div>`;

  document.getElementById('cancel-default').onclick = () => {
    editingDefault = false;
    load();
  };

  document.getElementById('save-default').onclick = async () => {
    const raw = document.getElementById('default-input').value;
    const providers = raw.split(',').map(s => s.trim()).filter(s => s);
    const errEl = document.getElementById('default-error');
    errEl.textContent = '';
    try {
      // Same-origin fetch: the browser attaches the session cookie and
      // Sec-Fetch-Site: same-origin, which is what the CSRF check wants.
      const resp = await fetch('/admin/routes/default', {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ providers }),
      });
      const body = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        // Surface the server's message verbatim — it names the offending
        // provider, which is the whole reason validation lives server-side.
        errEl.textContent = body.error || `request failed (${resp.status})`;
        return;
      }
      if (body.persisted === false) {
        errEl.style.color = 'var(--amber)';
        errEl.textContent =
          'Saved, but not persisted: no route table store is configured, ' +
          'so this reverts on restart.';
        setTimeout(() => { editingDefault = false; load(); }, 4000);
        return;
      }
      editingDefault = false;
      load();
    } catch (e) {
      errEl.textContent = String(e);
    }
  };
}

// ── Add Provider form (Plan 021 WI-5) ────────────────────────────────────
// Lives outside #app for the same reason the default-route editor does: the
// 5 s poll rebuilds #app wholesale and would wipe a half-filled form.
// `editingProvider` freezes this section while the form is open, so a poll
// landing mid-edit cannot discard what was typed.
let editingProvider = false;
// null  → add mode (POST /admin/providers).
// name  → edit mode (PUT /admin/providers/<name>); the name is the path key
//         and is not editable. Set by editProvider() before renderProviderForm.
let editingProviderName = null;
// Section-key Set of fields an environment variable owns for the provider
// being edited (Plan 021 WI-7 provenance). A locked field renders disabled:
// editing it here would be discarded at the next restart because env > store.
let editEnvLocked = null;
// The edited provider's current key_mode. The edit form does not offer a
// mode switcher — it renders the credential input appropriate to the existing
// mode — so _saveProvider reads this to send the right key_mode without
// depending on which credential input elements happen to be in the DOM.
let editingKeyMode = null;
// Round-trip helpers for fields the form does not expose but must not clobber:
// `account` (Plan 019 forward-compat column) and the TOML-stored flag (a
// TOML-only stored provider has no store row, so keep-on-blank is impossible).
let editingAccount = null;
let editingTomlStored = false;
// Monotonic token guarding editProvider's async fetch-then-render against
// reentrancy (double-click, or an Edit racing an Add). The latest opener
// bumps it; a late render whose captured token is stale is a no-op.
let editToken = 0;
let registryCache = null;

function renderAddProvider(_data) {
  if (editingProvider) return;
  const el = document.getElementById('add-provider');
  el.innerHTML = `
    <h2>Providers</h2>
    <div class="card">
      <p style="margin:0 0 0.6rem;color:var(--muted);font-size:0.85rem">
        Add a provider by pasting the vendor's documented base URL. Pick a
        registry entry to pre-fill, or use &ldquo;generic&rdquo; and type it.
      </p>
      <button id="add-provider-btn">Add provider</button>
    </div>`;
  const btn = document.getElementById('add-provider-btn');
  if (btn) btn.onclick = () => {
    // Clear any stale edit state so an Add-form save cannot route to a PUT
    // for a provider that was being edited when the operator switched to
    // Add (review finding 4: cross-provider config clobber). Bump editToken
    // so an in-flight editProvider render cannot overwrite this Add form.
    editToken = (editToken || 0) + 1;
    editingProvider = true; editingProviderName = null;
    editEnvLocked = null; editingKeyMode = null;
    editingAccount = null; editingTomlStored = false;
    renderProviderForm();
  };
}

async function _loadRegistry() {
  if (registryCache) return registryCache;
  try {
    const resp = await fetch('/admin/providers/registry', { credentials: 'same-origin' });
    if (resp.ok) registryCache = (await resp.json()).providers || [];
  } catch (e) { registryCache = []; }
  return registryCache || [];
}

// One credential mode's inputs, rendered inline on form open and rewritten
// into #pf-cred-block when the operator switches modes. `existing` is the
// masked row in edit mode, null in add mode.
function _credBlockHtml(mode, existing, tomlStored, isLocked, lockNote, lockAttr) {
  if (mode === 'stored') {
    const wasStored = !!existing && existing.key_mode === 'stored';
    const hint = wasStored && existing.api_key_hint
      ? 'stored (ending ' + esc(existing.api_key_hint) + ') — write-only'
      : (wasStored ? 'stored — write-only' : '');
    let keyLabel;
    if (!existing || !wasStored) {
      keyLabel = 'API key (sent once; stored server-side, never shown again)';
    } else if (tomlStored) {
      keyLabel = 'API key (required — re-enter; the store has no copy of this TOML key)';
    } else {
      keyLabel = 'New API key (leave blank to keep current)';
    }
    return `
      ${hint ? `<div class="form-row"><label>API key</label>
        <span style="color:var(--muted);font-size:0.85rem">${hint}</span></div>` : ''}
      <div class="form-row">
        <label for="pf-key-new">${esc(keyLabel)}</label>
        <input id="pf-key-new" type="password" autocomplete="off">
      </div>`;
  }
  if (mode === 'passthrough') {
    const eraseWarn = existing && existing.key_mode === 'stored'
      ? `<div class="form-row"><span style="color:var(--red);font-size:0.85rem">
         &#9888; saving in passthrough mode ERASES this provider&apos;s stored API key
         from the config store — switching back later means re-entering it</span></div>`
      : '';
    return `
      <div class="form-row">
        <label>API key</label>
        <span style="color:var(--muted);font-size:0.85rem">passthrough — no credential;
        the client&apos;s key is forwarded verbatim to this upstream</span>
      </div>${eraseWarn}`;
  }
  const envVal = existing ? esc(existing.api_key_env || '') : '';
  return `
      <div class="form-row">
        <label for="pf-key-env">API key env var (name only — value stays server-side)</label>
        <input id="pf-key-env" autocomplete="off" placeholder="e.g. SWITCHBOARD_OLLAMA_KEY"
          value="${envVal}"${lockAttr('api_key_env')}>
        ${isLocked('api_key_env') ? lockNote : ''}
      </div>`;
}

function renderProviderForm(existing) {
  const el = document.getElementById('add-provider');
  const editing = !!existing;
  const locked = editEnvLocked || new Set();
  // `locked` uses provider-section keys (upstream, target, type, enabled, …)
  // as produced by env_config; map each form field through that vocabulary.
  const isLocked = (sectionKey) => editing && locked.has(sectionKey);
  const lockNote = '<span style="color:var(--amber);font-size:0.75rem">'
    + '&#128274; env-locked — owned by a Deployment variable; '
    + 'a GUI edit is discarded at restart</span>';
  const lockAttr = (sectionKey) => isLocked(sectionKey) ? ' disabled' : '';
  // In edit mode every managed field is sent on PUT (the store's upsert
  // requires upstream/provider_type/target/key_mode verbatim and does not
  // merge), so locked inputs keep their prefilled value — re-sending it is
  // a no-op for the store and env still wins at boot.

  const title = editing ? 'Edit Provider' : 'Add Provider';
  // Store rows expose `provider_type`; TOML sections expose the TOML key
  // `type` (see _masked_toml_section). Resolve from either so a TOML
  // provider's real type is not silently rewritten to 'generic' on save,
  // which would create a store row shadowing the TOML section wholesale.
  const ptype = editing ? (existing.provider_type || existing.type || 'generic') : 'generic';
  // TOML-only providers have no store row yet: the store's write-only
  // "absent key means keep" branch needs an existing row, so a TOML
  // provider with an inline api_key (stored) cannot keep-on-blank — the
  // browser never had the credential and the store has no copy. Detect
  // that so the credential block and save validation are honest about it.
  const tomlStored = editing && existing.source === 'toml' && (existing.key_mode === 'stored');

  // Credential handling (Plan 025): every form gets a mode selector — env
  // var (recommended), stored (paste the key once; write-only and masked
  // thereafter), passthrough (explicit downgrade: the client's key is
  // forwarded). The server has supported all three on create/update since
  // Plan 020 Wave 1; the Add form just never offered stored, which made
  // "add a provider with its API key from the browser" impossible.
  const km = editing ? (existing.key_mode || 'passthrough') : 'env';
  const credBlock = `
      <div class="form-row">
        <label for="pf-key-mode">Credential mode</label>
        <select id="pf-key-mode">
          <option value="env"${km === 'env' ? ' selected' : ''}>server env var (recommended)</option>
          <option value="stored"${km === 'stored' ? ' selected' : ''}>paste API key (stored server-side, write-only)</option>
          <option value="passthrough"${km === 'passthrough' ? ' selected' : ''}>passthrough (forward the client&apos;s key)</option>
        </select>
      </div>
      <div id="pf-cred-block">${_credBlockHtml(km, editing ? existing : null, tomlStored, isLocked, lockNote, lockAttr)}</div>`;

  // Edit-only fields. The quick-add form relies on server defaults for these;
  // editing is where an operator tunes the full row (Plan 020 WI-6).
  const editExtras = editing ? `
      <div class="form-row">
        <label for="pf-type">Provider type</label>
        <input id="pf-type" autocomplete="off" value="${esc(ptype)}"${lockAttr('type')}>
        ${isLocked('type') ? lockNote : ''}
      </div>
      <div class="form-row">
        <label for="pf-auth-prefix">Auth prefix</label>
        <input id="pf-auth-prefix" autocomplete="off" placeholder="e.g. Bearer"
          value="${esc(existing.auth_prefix || '')}"${lockAttr('auth_prefix')}>
        ${isLocked('auth_prefix') ? lockNote : ''}
      </div>
      <div class="form-row">
        <label for="pf-dashboard-url">Usage dashboard URL (optional)</label>
        <input id="pf-dashboard-url" autocomplete="off" placeholder="https://dashboard/v1"
          value="${esc(existing.dashboard_url || '')}"${lockAttr('dashboard_url')}>
        ${isLocked('dashboard_url') ? lockNote : ''}
      </div>
      <div class="form-row">
        <label for="pf-dashboard-token-env">Dashboard token env var (optional)</label>
        <input id="pf-dashboard-token-env" autocomplete="off"
          value="${esc(existing.dashboard_token_env || '')}"${lockAttr('dashboard_token_env')}>
        ${isLocked('dashboard_token_env') ? lockNote : ''}
      </div>
      <div class="form-row">
        <label for="pf-dashboard-provider">Dashboard provider id (when the dashboard names this provider differently, e.g. "opencode" for opencode-go)</label>
        <input id="pf-dashboard-provider" autocomplete="off" placeholder="e.g. zai"
          value="${esc(existing.dashboard_provider || '')}"${lockAttr('dashboard_provider')}>
        ${isLocked('dashboard_provider') ? lockNote : ''}
      </div>
      <div class="form-row">
        <label for="pf-peak-windows">Peak-pricing windows, one per line (provider is demoted while inside one; blank = none)</label>
        <textarea id="pf-peak-windows" rows="2" autocomplete="off"
          placeholder="mon-fri 14:00-18:00 +08:00"
          style="width:100%;padding:0.4rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:inherit"></textarea>
      </div>
      <div class="form-row">
        <label for="pf-usage-key-env">Usage key env var (optional)</label>
        <input id="pf-usage-key-env" autocomplete="off"
          value="${esc(existing.usage_key_env || '')}"${lockAttr('usage_key_env')}>
        ${isLocked('usage_key_env') ? lockNote : ''}
      </div>
      <div class="form-row">
        <label><input id="pf-enabled" type="checkbox"
          ${existing.enabled === false ? '' : 'checked'}${lockAttr('enabled')}>
          Enabled (uncheck to retire without deleting)</label>
        ${isLocked('enabled') ? lockNote : ''}
      </div>` : '';

  // The registry picker is an add-mode affordance; in edit mode the base URL
  // is already populated and a pick would clobber operator edits.
  const registryRow = editing ? '' : `
      <div class="form-row">
        <label for="pf-registry">From registry (optional)</label>
        <select id="pf-registry"><option value="">loading…</option></select>
      </div>`;

  el.innerHTML = `
    <h2>${title}</h2>
    <div class="card">
      ${registryRow}
      <div class="form-row">
        <label for="pf-name">Name</label>
        <input id="pf-name" autocomplete="off" placeholder="e.g. ollama-cloud"
          value="${editing ? esc(existing.name || '') : ''}"${editing ? ' disabled' : ''}>
        ${editing ? '<span style="color:var(--muted);font-size:0.75rem">the name is the route key; rename via delete + add</span>' : ''}
      </div>
      <div class="form-row">
        <label for="pf-base">Base URL (vendor documented API root)</label>
        <input id="pf-base" autocomplete="off" placeholder="e.g. https://ollama.com/v1"
          value="${editing ? esc(existing.upstream || '') : ''}"${lockAttr('upstream')}>
        ${isLocked('upstream') ? lockNote : ''}
      </div>
      <div class="form-row">
        <label>Live preview (composed upstream for /v1/chat/completions)</label>
        <code id="pf-preview" style="display:block;background:var(--bg);padding:0.4rem 0.5rem;
          border-radius:4px;font-size:0.82rem;color:var(--muted);min-height:1.2em"></code>
      </div>
      <div class="form-row">
        <label for="pf-target">Target concurrency</label>
        <input id="pf-target" type="number" min="1" value="${editing ? esc(existing.target || 1) : 1}"
          style="width:6rem"${lockAttr('target')}>
        ${isLocked('target') ? lockNote : ''}
      </div>
      <div class="form-row">
        <label for="pf-auth-header">Auth header</label>
        <input id="pf-auth-header" value="${editing ? esc(existing.auth_header || 'authorization') : 'authorization'}"
          autocomplete="off"${lockAttr('auth_header')}>
        ${isLocked('auth_header') ? lockNote : ''}
      </div>
      ${editExtras}
      ${credBlock}
      <div id="pf-discover" style="margin:0.3rem 0 0.6rem;font-size:0.82rem"></div>
      <div id="pf-error" style="color:var(--red);font-size:0.85rem;margin-bottom:0.5rem"></div>
      <button id="pf-test">Test &amp; detect</button>
      <button id="pf-save">${editing ? 'Save changes' : 'Save'}</button>
      <button id="pf-cancel" style="background:transparent;border:1px solid var(--border)">Cancel</button>
    </div>`;

  document.getElementById('pf-cancel').onclick = () => {
    editingProvider = false; editingProviderName = null;
    editEnvLocked = null; editingKeyMode = null;
    editingAccount = null; editingTomlStored = false;
    load();
  };
  if (!editing) {
    const regSel = document.getElementById('pf-registry');
    regSel.onchange = () => _applyRegistryPick(regSel.value);
  }
  const baseInput = document.getElementById('pf-base');
  let previewTimer = null;
  baseInput.oninput = () => {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(_refreshPreview, 150);
  };
  document.getElementById('pf-test').onclick = _runDiscover;
  document.getElementById('pf-save').onclick = _saveProvider;
  // Credential mode switch rewrites only the cred block; the rest of the
  // form (and anything already typed in it) stays put.
  {
    const modeSel = document.getElementById('pf-key-mode');
    if (modeSel) {
      modeSel.value = km;
      modeSel.onchange = () => {
        const block = document.getElementById('pf-cred-block');
        if (block) {
          block.innerHTML = _credBlockHtml(
            modeSel.value, editing ? existing : null, tomlStored,
            isLocked, lockNote, lockAttr);
        }
        if (modeSel.value === 'env' && editing) {
          const e = document.getElementById('pf-key-env');
          if (e && existing.api_key_env) e.value = existing.api_key_env;
        }
      };
    }
  }

  if (!editing) {
    // Populate the registry picker, then seed defaults from "generic".
    _loadRegistry().then(entries => {
      const opts = ['<option value="">— pick to pre-fill, or type below —</option>'];
      for (const e of entries) {
        opts.push(`<option value="${esc(e.name)}">${esc(e.name)}${
          e.default_base_url ? ' — ' + esc(e.default_base_url) : ''
        }</option>`);
      }
      const sel = document.getElementById('pf-registry');
      if (sel) sel.innerHTML = opts.join('');
    });
  } else {
    // Populate element values explicitly. A real browser derives these from
    // the value="" attributes already in the HTML, but setting them here too
    // is harmless and keeps the form testable without a browser-DOM that
    // reflects attributes into properties. Prefill comes from the store row
    // (the tier the PUT writes), not the env-merged effective view.
    editingKeyMode = km;
    editingAccount = existing.account != null ? existing.account : null;
    editingTomlStored = tomlStored;
    const setv = (id, val) => {
      const e = document.getElementById(id);
      if (e && val != null && val !== '') e.value = val;
    };
    setv('pf-name', existing.name);
    setv('pf-base', existing.upstream);
    setv('pf-target', existing.target);
    setv('pf-auth-header', existing.auth_header);
    setv('pf-type', ptype);
    setv('pf-auth-prefix', existing.auth_prefix);
    setv('pf-dashboard-url', existing.dashboard_url);
    setv('pf-dashboard-token-env', existing.dashboard_token_env);
    setv('pf-usage-key-env', existing.usage_key_env);
    setv('pf-dashboard-provider', existing.dashboard_provider);
    const pwEl = document.getElementById('pf-peak-windows');
    if (pwEl) pwEl.value = (existing.peak_windows || []).join('\n');
    if (km === 'env') setv('pf-key-env', existing.api_key_env);
    const enEl = document.getElementById('pf-enabled');
    if (enEl) enEl.checked = existing.enabled !== false;
    _refreshPreview();
  }
}

function _applyRegistryPick(name) {
  if (!registryCache) return;
  const entry = registryCache.find(e => e.name === name);
  if (!entry) return;
  if (entry.default_base_url) document.getElementById('pf-base').value = entry.default_base_url;
  if (entry.auth_header) document.getElementById('pf-auth-header').value = entry.auth_header;
  if (!document.getElementById('pf-name').value) document.getElementById('pf-name').value = name;
  _refreshPreview();
}

async function _refreshPreview() {
  const base = (document.getElementById('pf-base') || {}).value || '';
  const out = document.getElementById('pf-preview');
  if (!out) return;
  if (!base.trim()) { out.textContent = ''; return; }
  try {
    const q = new URLSearchParams({ base, path: '/v1/chat/completions' });
    const resp = await fetch('/admin/preview-path?' + q, { credentials: 'same-origin' });
    if (resp.ok) {
      const data = await resp.json();
      out.textContent = data.composed || '';
    }
  } catch (e) { /* preview is best-effort */ }
}

async function _runDiscover() {
  const base = (document.getElementById('pf-base') || {}).value || '';
  const out = document.getElementById('pf-discover');
  const errEl = document.getElementById('pf-error');
  errEl.textContent = '';
  if (!base.trim()) { errEl.textContent = 'enter a base URL first'; return; }
  out.innerHTML = '<span style="color:var(--muted)">probing…</span>';
  try {
    // No credential is sent: the key lives in a server-side env var the
    // browser never sees. Public /models endpoints answer; auth-gated ones
    // report 401/403 — the composition is still discoverable from the URL
    // that was tried. After saving, the per-provider Test uses the credential.
    const resp = await fetch('/admin/providers/discover', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ base_url: base.trim() }),
    });
    const data = await resp.json();
    if (!resp.ok) { errEl.textContent = data.error || ('HTTP ' + resp.status); return; }
    const rows = (data.candidates || []).map(c => {
      const mark = c.ok ? '✓' : (c.status ? '✗' : '·');
      const color = c.ok ? 'var(--green)' : 'var(--muted)';
      const st = c.ok ? 'ok' : (c.detail || (c.status != null ? c.status : 'no response'));
      return `<div style="color:${color}">${mark} <code>${esc(c.url)}</code> — ${esc(st)}</div>`;
    });
    const okCount = (data.candidates || []).filter(c => c.ok).length;
    out.innerHTML = `<div style="margin-bottom:0.3rem">${okCount} answered</div>${rows.join('')}`;
  } catch (e) { errEl.textContent = String(e); }
}

async function _saveProvider() {
  const name = (document.getElementById('pf-name') || {}).value.trim();
  const upstream = (document.getElementById('pf-base') || {}).value.trim();
  const target = parseInt((document.getElementById('pf-target') || {}).value, 10) || 1;
  const auth_header = (document.getElementById('pf-auth-header') || {}).value.trim() || 'authorization';
  const apiKeyEnvEl = document.getElementById('pf-key-env');
  // pf-key-env only exists while the env credential mode is rendered; guard
  // against a missing element in stored/passthrough modes.
  const api_key_env = apiKeyEnvEl ? (apiKeyEnvEl.value || '').trim() : '';
  // Credential mode: the selector wins; an unset selector (a fresh element
  // in the test harness, or a half-rendered form) infers from what was
  // typed, falling back to the row's existing mode in edit mode.
  const keyNewEl = document.getElementById('pf-key-new');
  const keyNew = keyNewEl ? (keyNewEl.value || '').trim() : '';
  const modeSelEl = document.getElementById('pf-key-mode');
  let key_mode = modeSelEl && modeSelEl.value ? modeSelEl.value : '';
  if (!key_mode) {
    key_mode = keyNew ? 'stored' : (api_key_env ? 'env' : (editingKeyMode || ''));
  }
  const errEl = document.getElementById('pf-error');
  errEl.textContent = '';
  // Name is read-only in edit mode but still required; check both paths.
  if (!name) { errEl.textContent = 'name is required'; return; }
  if (!upstream) { errEl.textContent = 'base URL is required'; return; }

  // Edit mode requires both the freeze flag AND a target name. The Add
  // button clears the edit vars, so a stale editingProviderName cannot route
  // an Add-form save to a PUT (review finding 4: cross-provider clobber).
  const editing = editingProvider && editingProviderName !== null;
  let url, method, body;
  if (editing) {
    // Edit mode: PUT the full row. The store's upsert does not merge — it
    // requires upstream/provider_type/target/key_mode verbatim — so every
    // managed field is sent, locked ones at their prefilled (unchanged)
    // value. Credential handling is write-only: api_key_stored is sent only
    // when the operator typed a new one, otherwise the store keeps it.
    const provider_type = (document.getElementById('pf-type') || {}).value.trim() || 'generic';
    const auth_prefix = (document.getElementById('pf-auth-prefix') || {}).value.trim();
    const dashboard_url = (document.getElementById('pf-dashboard-url') || {}).value.trim();
    const dashboard_token_env = (document.getElementById('pf-dashboard-token-env') || {}).value.trim();
    const usage_key_env = (document.getElementById('pf-usage-key-env') || {}).value.trim();
    const dashboard_provider = (document.getElementById('pf-dashboard-provider') || {}).value.trim();
    // One window spec per line; always sent, so emptying the field clears
    // the row's windows (the store treats [] as "none").
    const pwRaw = (document.getElementById('pf-peak-windows') || {}).value || '';
    const peak_windows = pwRaw.split('\n').map(s => s.trim()).filter(s => s);
    const enabledEl = document.getElementById('pf-enabled');
    const enabled = enabledEl ? !!enabledEl.checked : true;
    // Round-trip `account` so a non-default account is not silently reset to
    // 'default' on edit (the store does not merge, and _build_row defaults a
    // missing account). The form does not expose account editing yet.
    body = {
      provider_type, upstream, target, auth_header,
      dashboard_url, dashboard_token_env, usage_key_env, enabled,
      peak_windows,
    };
    if (editingAccount != null) body.account = editingAccount;
    if (auth_prefix) body.auth_prefix = auth_prefix;
    if (dashboard_provider) body.dashboard_provider = dashboard_provider;
    // Credential handling follows the selector (Plan 025: modes are
    // switchable on edit). Write-only for stored: api_key_stored is sent
    // only when the operator typed one; blank keeps the existing stored key
    // — UNLESS the row has no stored copy to keep (a mode switch onto
    // stored, or a TOML-only stored provider with no store row), where the
    // key is required.
    if (key_mode === 'env') {
      body.key_mode = 'env';
      body.api_key_env = api_key_env;
    } else if (key_mode === 'stored') {
      body.key_mode = 'stored';
      const hasKeptKey = editingKeyMode === 'stored' && !editingTomlStored;
      if (!keyNew && !hasKeptKey) {
        errEl.textContent = editingTomlStored
          ? 'enter the API key — this TOML provider has no stored copy to keep'
          : 'enter the API key — switching to stored mode needs the credential';
        return;
      }
      if (keyNew) body.api_key_stored = keyNew;
    } else {
      body.key_mode = 'passthrough';
    }
    url = '/admin/providers/' + encodeURIComponent(editingProviderName);
    method = 'PUT';
  } else {
    // Add mode (Plan 025): all three credential modes. There is NO server
    // default for key_mode (the store requires it), so a quick-add with the
    // env field left blank is sent as explicit passthrough — same semantics
    // a bare TOML provider gets — rather than 400ing on a missing field
    // (cross-lineage review, finding 3).
    body = { name, upstream, provider_type: 'generic', target, auth_header };
    if (key_mode === 'stored') {
      if (!keyNew) {
        errEl.textContent = 'enter the API key to store for this provider';
        return;
      }
      body.key_mode = 'stored';
      body.api_key_stored = keyNew;
    } else if (key_mode === 'env' && api_key_env) {
      body.key_mode = 'env';
      body.api_key_env = api_key_env;
    } else {
      body.key_mode = 'passthrough';
    }
    url = '/admin/providers';
    method = 'POST';
  }
  try {
    const resp = await fetch(url, {
      method,
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) { errEl.textContent = data.error || ('HTTP ' + resp.status); return; }
    editingProvider = false; editingProviderName = null;
    editEnvLocked = null; editingKeyMode = null;
    editingAccount = null; editingTomlStored = false;
    load();
  } catch (e) { errEl.textContent = String(e); }
}

// ── Edit Provider (Plan 020 WI-6) ─────────────────────────────────────────
// Opens the provider form pre-filled with the store row (the tier the PUT
// writes to), with env-owned fields disabled. The env-lock set comes from
// /admin/config/effective (Plan 021 WI-7 provenance); the editable values
// come from /admin/providers (masked store/toml row, not env-merged, so the
// form edits exactly the tier it writes).
async function _loadProviderForEdit(name) {
  let existing = null;
  try {
    const resp = await fetch('/admin/providers', { credentials: 'same-origin' });
    if (resp.ok) {
      const all = (await resp.json()).providers || [];
      existing = all.find(p => p.name === name) || null;
    }
  } catch (e) { existing = null; }
  if (!existing) {
    // The provider vanished between the click and the fetch (delete, drain,
    // or a tombstone). Abort the edit rather than render a form for nothing.
    editingProvider = false; editingProviderName = null;
    editEnvLocked = null; editingKeyMode = null;
    editingAccount = null; editingTomlStored = false;
    load();
    return null;
  }
  let lockedKeys = [];
  try {
    const resp = await fetch('/admin/config/effective', { credentials: 'same-origin' });
    if (resp.ok) {
      const all = (await resp.json()).providers || [];
      const entry = all.find(p => p.name === name);
      if (entry) {
        // env_locked is the canonical list; fall back to field_sources keys.
        lockedKeys = entry.env_locked || Object.keys(entry.field_sources || {});
      }
    }
  } catch (e) { lockedKeys = []; }
  editEnvLocked = new Set(lockedKeys);
  return existing;
}

async function editProvider(name) {
  // Reentrancy guard (review finding 4): two rapid Edit clicks start two
  // async fetch sequences whose renders can land out of order, so a save
  // could PUT one provider's form under another's name. A monotonic token
  // makes the first click's late render a no-op: only the latest click wins.
  editToken = (editToken || 0) + 1;
  const myToken = editToken;
  editingProvider = true;
  editingProviderName = name;
  const existing = await _loadProviderForEdit(name);
  if (myToken !== editToken) return;  // a newer Edit (or Add) superseded this one
  if (existing) renderProviderForm(existing);
}

// Plan 024 — fetch a provider's enumerated models for the datalist. Cached
// per form-open so a provider is probed once per session, not per keystroke.
let modelEnums = {};   // { providerName: Promise<{ok,models,detail}> }

async function _fetchProviderModels(provider) {
  // Finding #1 fix: store the in-flight PROMISE, not null, so a concurrent
  // caller (double-click on "show models") awaits the same promise rather
  // than getting null back and throwing on `res.models`. The guard is
  // `!== undefined`; a stored promise is defined, so the second caller
  // awaits it and gets the resolved result.
  if (modelEnums[provider] !== undefined) return modelEnums[provider];
  const promise = (async () => {
    try {
      const resp = await fetch(
        '/admin/providers/' + encodeURIComponent(provider) + '/models',
        { credentials: 'same-origin' },
      );
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        return { ok: false, models: [], detail: data.error || ('HTTP ' + resp.status) };
      }
      return {
        ok: !!data.ok,
        models: Array.isArray(data.models) ? data.models : [],
        detail: data.detail || (data.ok ? '' : 'no models'),
      };
    } catch (e) {
      return { ok: false, models: [], detail: String(e) };
    }
  })();
  modelEnums[provider] = promise;
  return promise;
}

// Add/edit a model mapping. With only `knownProviders`, renders the add
// form; `editModelName` + `editAliases` switch it to edit mode: the model
// name (the map key) is locked, alias inputs are pre-filled, and saving
// POSTs the full replacement alias set — POST /admin/model-map is
// add-or-update server-side, so clearing an alias removes that provider
// from the model.
function renderModelAddForm(knownProviders, editModelName, editAliases) {
  const el = document.getElementById('model-add');
  const provs = (knownProviders || []).slice().sort();
  const editing = !!editModelName;
  // Finding #4 fix: provider names have no character validation (only
  // _RESERVED_PROVIDER_NAMES is checked), so a name containing &<>"' would
  // render an id attribute that getElementById — which expects the raw
  // string, not the escaped one — cannot find. _domId sanitises the name
  // for id use; the same function is used in both the attribute and the
  // lookup so they always agree.
  const _domId = (p) => 'mf-' + p.replace(/[^A-Za-z0-9_-]/g, '_');
  const aliasRows = provs.map(p => {
    const idp = _domId(p);
    return `
    <div class="form-row">
      <label for="${idp}-alias">${esc(p)} alias</label>
      <input id="${idp}-alias" list="${idp}-models"
             autocomplete="off" placeholder="leave blank if ${esc(p)} does not serve it">
      <datalist id="${idp}-models"></datalist>
      <button type="button" id="${idp}-show" class="mini-btn"
              style="margin-left:0.4rem">show models</button>
      <span id="${idp}-status" style="margin-left:0.4rem;font-size:0.8rem;color:var(--muted)"></span>
      <div id="${idp}-list" style="max-height:9rem;overflow-y:auto;margin-top:0.3rem"></div>
    </div>`;
  }).join('');
  const editNote = editing
    ? '<span style="color:var(--muted);font-size:0.75rem">the model name is the map key; rename via delete + add. Clearing an alias removes that provider from the model.</span>'
    : '';
  el.innerHTML = `
    <h2>${editing ? 'Edit Model Mapping' : 'Add Model Mapping'}</h2>
    <div class="card">
      <div class="form-row">
        <label for="mf-model">Model name (as the client sends it)</label>
        <input id="mf-model" list="mf-model-known" autocomplete="off"
               placeholder="e.g. glm-5.2"${editing ? ' disabled' : ''}>
        <datalist id="mf-model-known"></datalist>
        ${editNote}
      </div>
      ${aliasRows || '<p style="color:var(--muted)">No providers configured.</p>'}
      <div id="mf-error" style="color:var(--red);font-size:0.85rem;margin-bottom:0.5rem"></div>
      <button id="mf-save">${editing ? 'Save changes' : 'Save'}</button>
      <button id="mf-cancel" style="background:transparent;border:1px solid var(--border)">Cancel</button>
    </div>`;
  // Populate values explicitly rather than via value="" attributes: fresh
  // innerHTML gives a real browser empty inputs, but the GUI test harness's
  // fake DOM keeps elements across renders, and edit-mode prefill needs the
  // assignment path anyway (same pattern as the provider form).
  {
    const nameEl = document.getElementById('mf-model');
    if (nameEl) nameEl.value = editing ? editModelName : '';
    for (const p of provs) {
      const e = document.getElementById(_domId(p) + '-alias');
      if (e) e.value = (editing && editAliases && editAliases[p]) ? editAliases[p] : '';
    }
  }
  document.getElementById('mf-cancel').onclick = () => { editingModel = false; load(); };
  // Fresh form open → fresh probe cache. A prior form open's enumerated
  // models may be stale (provider changed, or a provider was just added);
  // clearing on open keeps "one probe per provider per form open" honest.
  modelEnums = {};
  // Union of every enumeration fetched this form-open; feeds the model-name
  // datalist so the operator can pick the client-facing name from what the
  // providers actually serve (before this, mf-model-known was never filled).
  const modelNameUnion = new Set();
  // Per-provider "show models" → populate the alias input's datalist AND a
  // visible click-to-fill list. The datalist alone only surfaces once the
  // operator types into the input, which read as "the button did nothing".
  // One upstream call per provider per form-open (cached in modelEnums).
  provs.forEach(p => {
    const idp = _domId(p);
    const btn = document.getElementById(idp + '-show');
    if (btn) btn.onclick = async () => {
      const statusEl = document.getElementById(idp + '-status');
      if (statusEl) statusEl.textContent = 'probing\u2026';
      const res = await _fetchProviderModels(p);
      const models = res.models || [];
      const dl = document.getElementById(idp + '-models');
      if (dl) dl.innerHTML = models.map(m => `<option value="${esc(m)}">`).join('');
      const listEl = document.getElementById(idp + '-list');
      if (listEl) {
        listEl.innerHTML = models.map((m, i) =>
          `<button type="button" id="${idp}-pick-${i}" class="mini-btn"
                   style="margin:0.1rem 0.2rem 0.1rem 0">${esc(m)}</button>`).join('');
        models.forEach((m, i) => {
          const pickBtn = document.getElementById(idp + '-pick-' + i);
          if (pickBtn) pickBtn.onclick = () => {
            const aliasEl = document.getElementById(idp + '-alias');
            if (aliasEl) aliasEl.value = m;
          };
        });
      }
      if (models.length) {
        models.forEach(m => modelNameUnion.add(m));
        const knownDl = document.getElementById('mf-model-known');
        if (knownDl) {
          knownDl.innerHTML = Array.from(modelNameUnion).sort()
            .map(m => `<option value="${esc(m)}">`).join('');
        }
      }
      if (statusEl) {
        if (res.ok && models.length) {
          statusEl.textContent = `${models.length} model${models.length === 1 ? '' : 's'}`
            + ' — click one to fill the alias';
        } else {
          statusEl.textContent = res.detail || 'no models';
        }
      }
    };
  });
  document.getElementById('mf-save').onclick = async () => {
    const model = (document.getElementById('mf-model') || {}).value.trim();
    const errEl = document.getElementById('mf-error');
    errEl.textContent = '';
    if (!model) { errEl.textContent = 'model name is required'; return; }
    const aliases = {};
    for (const p of provs) {
      const v = (document.getElementById(_domId(p) + '-alias') || {}).value.trim();
      if (v) aliases[p] = v;
    }
    if (!Object.keys(aliases).length) {
      errEl.textContent = 'fill in at least one provider alias';
      return;
    }
    // Editing: clearing an alias removes that provider from the model
    // (the POST replaces the whole set) — destructive with no undo, so it
    // gets the same confirm() as the sibling delete actions.
    if (editing && editAliases) {
      const removed = Object.keys(editAliases).filter(p => !(p in aliases));
      if (removed.length && !confirm(
            'Remove ' + removed.join(', ') + ' from ' + editModelName + '? '
            + 'Cleared aliases are deleted from the mapping.')) {
        return;
      }
    }
    try {
      const resp = await fetch('/admin/model-map', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ model, aliases }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) { errEl.textContent = data.error || ('HTTP ' + resp.status); return; }
      editingModel = false; load();
    } catch (e) { errEl.textContent = String(e); }
  };
}

// Plan 024 WI-3 — auto-match scan. For each configured provider, fetch its
// enumerated models, then for every defined model name check whether the
// provider offers an exact string match that the model map does not already
// wire. Matches become one-click "Add" offers; no write happens without the
// click. A provider that fails to answer is listed, not aborting the scan.
// The scan renders into the Model Map card, which the 5 s poll rebuilds.
// scanPinned freezes that card from scan start (before the first await —
// a poll landing mid-scan would detach statusEl/outEl and the results
// would render into nodes no longer on the page) until the operator
// dismisses the results.
async function runAutoMatchScan(providers, definedModels, currentMap) {
  const statusEl = document.getElementById('scan-match-status');
  const outEl = document.getElementById('scan-match-results');
  if (!outEl) return;
  scanPinned = true;
  if (!definedModels.length) {
    outEl.innerHTML = '<p style="color:var(--muted)">No models defined yet — add a model mapping first.</p>'
      + _scanDismissHtml();
    _wireScanDismiss();
    return;
  }
  outEl.innerHTML = '';
  if (statusEl) statusEl.textContent = 'scanning\u2026';
  const offers = [];   // {model, provider, alias}
  const failed = [];   // {provider, detail}
  for (const p of providers) {
    const res = await _fetchProviderModels(p);
    if (!res || !res.ok || !(res.models || []).length) {
      failed.push({ provider: p, detail: res ? (res.detail || 'no models') : 'no response' });
      continue;
    }
    for (const model of definedModels) {
      // Already wired for this provider? Skip — no duplicate offer.
      const existing = (currentMap[model] || {})[p];
      if (existing !== undefined) continue;
      if (res.models.indexOf(model) !== -1) {
        offers.push({ model, provider: p, alias: model });
      }
    }
  }
  if (statusEl) {
    const parts = [`${offers.length} match${offers.length === 1 ? '' : 'es'}`];
    if (failed.length) parts.push(`${failed.length} provider${failed.length === 1 ? '' : 's'} unavailable`);
    statusEl.textContent = parts.join(', ');
  }
  let html = '';
  for (const f of failed) {
    html += `<div style="color:var(--muted);font-size:0.85rem">${esc(f.provider)}: ${esc(f.detail)}</div>`;
  }
  if (!offers.length) {
    html += '<p style="color:var(--muted)">No exact-match offers.</p>';
  } else {
    for (let i = 0; i < offers.length; i++) {
      const o = offers[i];
      html += `<div style="margin:0.2rem 0">
        <button id="mf-am-${i}" class="mini-btn">Add</button>
        <code>${esc(o.model)}</code> &rarr; ${esc(o.provider)}: <code>${esc(o.alias)}</code>
      </div>`;
    }
  }
  outEl.innerHTML = html + _scanDismissHtml();
  offers.forEach((o, i) => {
    const b = document.getElementById('mf-am-' + i);
    if (b) b.onclick = () => applyAutoMatch(o, currentMap, 'mf-am-' + i);
  });
  _wireScanDismiss();
}

function _scanDismissHtml() {
  return '<div style="margin-top:0.4rem"><button id="scan-dismiss" class="mini-btn">Dismiss results</button></div>';
}

function _wireScanDismiss() {
  const d = document.getElementById('scan-dismiss');
  if (d) d.onclick = () => { scanPinned = false; load(); };
}

async function applyAutoMatch(offer, currentMap, btnId) {
  // Finding #2 fix: re-read the CURRENT model-map state before merging, so an
  // alias added between the last load() and this click is not silently dropped.
  // The model-map POST replaces the whole alias set, so a stale snapshot would
  // overwrite a concurrent add. currentMap is kept only as a fallback if the
  // re-read fails (better to apply with slightly-stale data than to refuse).
  let existing = Object.assign({}, currentMap[offer.model] || {});
  try {
    const resp = await fetch('/admin/model-map', { credentials: 'same-origin' });
    if (resp.ok) {
      const data = await resp.json().catch(() => ({}));
      const entry = (data.models || []).find(
        m => m.model === offer.model,
      );
      if (entry && entry.aliases) {
        existing = Object.assign({}, entry.aliases);
      }
    }
  } catch (e) { /* fall back to currentMap snapshot */ }
  existing[offer.provider] = offer.alias;
  try {
    const resp = await fetch('/admin/model-map', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ model: offer.model, aliases: existing }),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) { alert(data.error || ('HTTP ' + resp.status)); return; }
    // Mark the offer applied in place — the scan results stay pinned, so the
    // remaining offers survive this click instead of vanishing on reload.
    if (btnId) {
      const b = document.getElementById(btnId);
      if (b) { b.textContent = 'added ✓'; b.disabled = true; b.onclick = null; }
    }
    load();
  } catch (e) { alert(String(e)); }
}

async function deleteModel(model) {
  if (!confirm('Delete the mapping for ' + model + '?')) return;
  try {
    const resp = await fetch('/admin/model-map/' + encodeURIComponent(model), {
      method: 'DELETE', credentials: 'same-origin',
    });
    if (!resp.ok) {
      const b = await resp.json().catch(() => ({}));
      alert(b.error || ('HTTP ' + resp.status));
      return;
    }
    load();
  } catch (e) { alert(String(e)); }
}

// Plan 023 WI-4 — release a quarantined provider/model pair from the
// dashboard. DELETE /admin/quarantine/<provider>/<model> is the only way
// out by design: a timer would recreate the flapping the quarantine
// exists to stop.
async function releaseQuarantine(provider, model) {
  if (!confirm('Release the quarantine on ' + provider + '/' + model + '?\n'
             + 'It will resume taking traffic for this model immediately.')) return;
  try {
    const resp = await fetch(
      '/admin/quarantine/' + encodeURIComponent(provider) + '/' + encodeURIComponent(model),
      { method: 'DELETE', credentials: 'same-origin' },
    );
    if (!resp.ok) {
      const b = await resp.json().catch(() => ({}));
      alert(b.error || ('HTTP ' + resp.status));
      return;
    }
    load();
  } catch (e) { alert(String(e)); }
}

// Configuration provenance (Plan 021 WI-7). Which tier owns each provider,
// and which fields an env var has taken over. Fields shown as env-locked are
// owned by a Deployment variable: the edit-provider form (Plan 020 WI-6)
// renders them disabled, since editing them here would be discarded at the
// next restart. The provenance it reports answers "why is this value what it
// is" without reading the Deployment.
function renderConfig(cfg) {
  if (!cfg) return '';
  let html = '<h2>Configuration</h2>';

  const unmatched = cfg.unmatched_env_overrides || [];
  if (unmatched.length) {
    // These are inert — they name no configured provider. Worth shouting
    // about anyway: the operator who set them believes a deployment controls
    // a field it does not, and the boot-time log line has long scrolled away.
    html += `<div class="card" style="border-color:var(--amber)">
      <h3 style="color:var(--amber)">Ignored environment overrides</h3>
      <p style="margin:0 0 0.5rem;color:var(--muted);font-size:0.85rem">
        These match no configured provider and had no effect. Usually a typo
        in the provider name.
      </p>
      ${unmatched.map(v => `<div class="stat"><span class="k">
        <code>${esc(v)}</code></span></div>`).join('')}
    </div>`;
  }

  const providers = cfg.providers || [];
  if (!providers.length) return html + '<p style="color:var(--muted)">No providers.</p>';

  html += '<table><thead><tr><th>Provider</th><th>Config source</th>'
       +  '<th>Set by environment</th></tr></thead><tbody>';
  for (const p of providers) {
    const locked = Object.keys(p.field_sources || {}).sort();
    const disabled = p.enabled === false;
    const name = disabled
      ? `<s style="color:var(--muted)">${esc(p.name)}</s> <span class="badge unknown">disabled</span>`
      : esc(p.name);
    const lockedCells = locked.length
      ? locked.map(f => `<code style="color:var(--amber)" title="Owned by an environment variable; a GUI edit would be discarded at restart">${esc(f)}</code> <span class="badge unknown" style="font-size:0.7rem">env</span>`).join(' ')
      : '<span style="color:var(--muted)">&mdash;</span>';
    html += `<tr><td>${name}</td><td>${esc(p.source || '?')}</td>`
         +  `<td>${lockedCells}</td></tr>`;
  }
  html += '</tbody></table>';
  html += `<p style="color:var(--muted);font-size:0.8rem;margin-top:0.4rem">
    Precedence is environment &rarr; stored (GUI) &rarr; config file. A field
    listed above is owned by an environment variable, so editing it here would
    be discarded at the next restart.
  </p>`;
  return html;
}

function fmtTokens(n) {
  if (n == null) return '-';
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'k';
  return String(n);
}
function fmtPct(f) {
  if (f == null) return '-';
  return (f*100).toFixed(1)+'%';
}
function fmtDuration(sec) {
  if (sec == null) return '-';
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  if(h>0) return h+'h '+m+'m';
  if(m>0) return m+'m '+s+'s';
  return s+'s';
}

// ── Routing Config editor (Plan 020 WI-14 runtime swap) ──────────────────
// Lives outside #app for the same reason the default-route editor does: the
// 5 s poll rebuilds #app wholesale. `editingRouting` freezes this section
// while the form is open.
let editingRouting = false;

function renderRoutingConfigEditor(data) {
  if (editingRouting) return;
  const el = document.getElementById('routing-config-editor');
  const rc = data.routing_config;
  if (!rc) { el.innerHTML = ''; return; }

  // Pace surplus ranking (only meaningful when strategy is pace)
  let surplusHtml = '';
  if (rc.strategy === 'pace') {
    const provNames = Object.keys(data.providers || {});
    const scored = [];
    for (const name of provNames) {
      const p = data.providers[name];
      if (p && p.weekly_remaining_fraction != null && p.weekly_reset_epoch != null && !p.stale) {
        const resetIn = Math.max(0, (p.weekly_reset_epoch - Date.now()/1000));
        const daysUntilReset = resetIn / 86400;
        const burnRate = rc.pace_burn_rate_per_day != null ? rc.pace_burn_rate_per_day : 0.14;
        const surplus = p.weekly_remaining_fraction - burnRate * daysUntilReset;
        scored.push({name, surplus, remaining: p.weekly_remaining_fraction, resetIn});
      }
    }
    scored.sort((a, b) => b.surplus - a.surplus);
    if (scored.length > 0) {
      surplusHtml = '<div class="card"><h3>Pace Surplus Ranking</h3>'
        + '<p style="margin:0 0 0.5rem;color:var(--muted);font-size:0.8rem">'
        + 'Higher surplus = more quota than needed before reset → burn first.</p>';
      scored.forEach((s, i) => {
        const cls = s.surplus > 0 ? 'token-warn' : 'token-crit';
        surplusHtml += `<div class="stat"><span class="k">${i+1}. ${esc(s.name)}</span>`
          + `<span class="v ${cls}">${s.surplus >= 0 ? '+' : ''}${s.surplus.toFixed(3)}</span></div>`;
      });
      // Show unscored providers
      const unscored = provNames.filter(n => !scored.find(s => s.name === n));
      if (unscored.length > 0) {
        surplusHtml += '<p style="margin:0.4rem 0 0.2rem;color:var(--muted);font-size:0.8rem">'
          + 'Unscored (no fresh weekly data):</p>';
        unscored.forEach(n => {
          surplusHtml += `<div class="stat"><span class="k">${esc(n)}</span><span class="v" style="color:var(--muted)">unscored</span></div>`;
        });
      }
      surplusHtml += '</div>';
    }
  }

  el.innerHTML = `
    <h2>Routing Config</h2>
    <div class="grid">
      <div class="card">
        <h3>Strategy</h3>
        <div class="stat"><span class="k">strategy</span><span class="v">${esc(rc.strategy || 'ordered')}</span></div>
        <div class="stat"><span class="k">dwell_interval</span><span class="v">${rc.dwell_interval || '-'}</span></div>
        <div class="stat"><span class="k">failback_delay</span><span class="v">${rc.failback_delay != null ? rc.failback_delay : '-'}</span></div>
        ${rc.strategy === 'pace' ? `
          <div class="stat"><span class="k">burn_rate_per_day</span><span class="v">${rc.pace_burn_rate_per_day != null ? rc.pace_burn_rate_per_day : '-'}</span></div>
          <div class="stat"><span class="k">flap_margin</span><span class="v">${rc.pace_flap_margin != null ? rc.pace_flap_margin : '-'}</span></div>` : ''}
        <div style="margin-top:0.6rem"><button id="edit-routing">Edit Strategy</button></div>
      </div>
      ${surplusHtml}
    </div>`;

  const editBtn = document.getElementById('edit-routing');
  if (editBtn) editBtn.onclick = () => {
    editingRouting = true;
    renderRoutingConfigForm(rc);
  };
}

function renderRoutingConfigForm(rc) {
  const el = document.getElementById('routing-config-editor');
  el.innerHTML = `
    <h2>Routing Config</h2>
    <div class="card">
      <div class="form-row">
        <label for="rc-strategy">Strategy</label>

    const flapMargin = parseFloat(document.getElementById('rc-flap-margin').value);
    if (!isNaN(flapMargin)) body.pace_flap_margin = flapMargin;
    const dwell = parseFloat(document.getElementById('rc-dwell').value);
    if (!isNaN(dwell)) body.dwell_interval = dwell;
    const failback = parseFloat(document.getElementById('rc-failback').value);
    if (!isNaN(failback)) body.failback_delay = failback;

    const errEl = document.getElementById('rc-error');
    errEl.textContent = '';
    try {
      const resp = await fetch('/admin/config/routing', {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body),
      });
      const respBody = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        errEl.textContent = respBody.error || `request failed (${resp.status})`;
        return;
      }
      editingRouting = false;

    } catch (e) {
      errEl.textContent = String(e);
    }

async function load() {
  const resp = await fetch('/status.json');
  if (!resp.ok) {
    window.location.href = '/login';
    return;
  }
  const data = await resp.json();
  const el = document.getElementById('app');

  renderDefaultRoute(data);
  renderAddProvider(data);
  renderRouteAdd(data);
  renderModelAdd(data);
  renderRoutingConfigEditor(data);

  // Separate surface from status.json, and optional: a dashboard served
  // without an admin token still renders everything else rather than failing
  // whole because one panel could not be fetched.
  let cfg = null;
  try {
    const cresp = await fetch('/admin/config/effective', {
      credentials: 'same-origin',
    });
    if (cresp.ok) cfg = await cresp.json();
  } catch (e) {
    cfg = null;
  }

  let html = '<h2>Providers</h2><div class="grid">';
  const provNames = Object.keys(data.providers || {});
  provNames.forEach((name, provIdx) => {
    const p = data.providers[name];
    const reason = p.gate_closed_reason || 'open';
    const badgeCls = reason === 'open' ? 'open' : reason;
    const peakBadge = (p.peak && p.peak.in_peak)
      ? ' <span class="badge saturated" title="inside a peak-pricing window — demoted in routing">peak</span>'
      : '';
    html += `<div class="card">
      <h3>${esc(name)} <span class="badge ${badgeCls}">${reason}</span>${peakBadge}</h3>
      <div style="margin:-0.3rem 0 0.6rem">
        <button id="edit-prov-${provIdx}" class="mini-btn">Edit</button>
      </div>
      <div class="stat"><span class="k">effective_permits</span><span class="v">${p.effective_permits}</span></div>
      <div class="stat"><span class="k">in_flight</span><span class="v">${p.in_flight}</span></div>
      <div class="stat"><span class="k">queue_depth</span><span class="v">${p.queue_depth}</span></div>
      <div class="stat"><span class="k">ready</span><span class="v">${p.ready}</span></div>
      <div class="stat"><span class="k">total_429s</span><span class="v">${p.total_429s}</span></div>
      <div class="stat"><span class="k">total_requests_forwarded</span><span class="v">${p.total_requests_forwarded}</span></div>`;

    // Band / penalty
    if (p.band && p.band !== 'normal') {
      html += `<div class="section-title">Penalty</div>`;
      html += `<div class="stat"><span class="k">band</span><span class="v">${p.band}</span></div>`;
      if (p.penalty_started_at) {
        const elapsed = Math.floor(Date.now()/1000 - p.penalty_started_at);
        html += `<div class="stat"><span class="k">penalty_age</span><span class="v">${fmtDuration(elapsed)}</span></div>`;
      }
      if (p.low_interactivity) {
        html += `<div class="stat"><span class="k">low_interactivity</span><span class="v token-crit">yes</span></div>`;
        if (p.service_mode_resets_at) {
          const remaining = Math.max(0, Math.floor(p.service_mode_resets_at - Date.now()/1000));
          html += `<div class="stat"><span class="k">resets_in</span><span class="v">${fmtDuration(remaining)}</span></div>`;
        }
      }
    }

    // Token budget (streaming-tracked)
    if (p.token_budget) {
      const tb = p.token_budget;
      html += `<div class="section-title">Token Budget (streaming-tracked)</div>`;
      html += `<div class="stat"><span class="k">cap</span><span class="v">${fmtTokens(tb.cap_tokens)}</span></div>`;
      html += `<div class="stat"><span class="k">own_in_window</span><span class="v">${fmtTokens(tb.own_tokens_in_window)}</span></div>`;
      html += `<div class="stat"><span class="k">provider_wide</span><span class="v">${fmtTokens(tb.provider_wide_tokens)}</span></div>`;
      const util = tb.projected_utilization;
      const cls = util != null && util >= 0.85 ? 'token-crit' : (util != null && util >= 0.7 ? 'token-warn' : '');
      html += `<div class="stat"><span class="k">projected_util</span><span class="v ${cls}">${fmtPct(util)}</span></div>`;
    }

    // Usage history (poll-based)
    if (p.usage_history) {
      const uh = p.usage_history;
      html += `<div class="section-title">Usage History (poll-based)</div>`;
      const t24 = uh.tokens_24h;
      const cls24 = t24 != null && t24 >= 350e6 ? 'token-crit' : (t24 != null && t24 >= 250e6 ? 'token-warn' : '');
      html += `<div class="stat"><span class="k">tokens_24h</span><span class="v token-val ${cls24}">${fmtTokens(t24)}</span></div>`;
      html += `<div class="stat"><span class="k">24h_in</span><span class="v">${fmtTokens(uh.tokens_24h_in)}</span></div>`;
      html += `<div class="stat"><span class="k">24h_out</span><span class="v">${fmtTokens(uh.tokens_24h_out)}</span></div>`;
      html += `<div class="stat"><span class="k">24h_requests</span><span class="v">${uh.tokens_24h_requests || '-'}</span></div>`;

      if (uh.penalty) {
        const pen = uh.penalty;
        html += `<div class="section-title">Penalty Event Tokens</div>`;
        html += `<div class="stat"><span class="k">24h_before</span><span class="v">${fmtTokens(pen.before_total)}</span></div>`;
        html += `<div class="stat"><span class="k">before_reqs</span><span class="v">${pen.before_requests || '-'}</span></div>`;
        html += `<div class="stat"><span class="k">since_penalty</span><span class="v token-val">${fmtTokens(pen.since_total)}</span></div>`;
        html += `<div class="stat"><span class="k">since_reqs</span><span class="v">${pen.since_requests || '-'}</span></div>`;
      }
    }

    // Tokens from usage reading
    if (p.tokens_in != null || p.tokens_out != null) {
      html += `<div class="section-title">Usage Reading</div>`;
      html += `<div class="stat"><span class="k">tokens_in</span><span class="v">${fmtTokens(p.tokens_in)}</span></div>`;
      html += `<div class="stat"><span class="k">tokens_out</span><span class="v">${fmtTokens(p.tokens_out)}</span></div>`;
    }

    // Weekly-window quota (Plan 020 D6) — the pace strategy's signal.
    // Shows remaining %, reset countdown, and estimated days until exhausted
    // at the current burn rate.
    if (p.weekly_remaining_fraction != null) {
      html += `<div class="section-title">Weekly Quota</div>`;
      const remaining = p.weekly_remaining_fraction;
      const usedPct = (1 - remaining) * 100;
      const cls = remaining <= 0.15 ? 'token-crit' : (remaining <= 0.30 ? 'token-warn' : '');
      html += `<div class="stat"><span class="k">remaining</span><span class="v ${cls}">${fmtPct(remaining)}</span></div>`;
      html += `<div class="stat"><span class="k">used</span><span class="v">${usedPct.toFixed(1)}%</span></div>`;
      if (p.weekly_reset_epoch != null) {
        const resetIn = Math.max(0, Math.floor(p.weekly_reset_epoch - Date.now()/1000));
        html += `<div class="stat"><span class="k">resets_in</span><span class="v">${fmtDuration(resetIn)}</span></div>`;
        // Estimated days until exhausted: if 40% used and reset_in is 1 day,
        // burn rate = 0.40/day → remaining 0.60 / 0.40 = 1.5 days.
        // Only show when the provider is actively consuming (used > 0).
        if (usedPct > 0.5) {
          const daysElapsed = (86400 * 7 - resetIn) / 86400;
          if (daysElapsed > 0.01) {
            const burnPerDay = (usedPct / 100) / daysElapsed;
            if (burnPerDay > 0) {
              const daysLeft = remaining / burnPerDay;
              const estCls = daysLeft < 1 ? 'token-crit' : (daysLeft < 3 ? 'token-warn' : '');
              html += `<div class="stat"><span class="k">est_exhaustion</span><span class="v ${estCls}">${daysLeft.toFixed(1)} days</span></div>`;
            }
          }
        }
      }
    }

    // Peak-pricing window (Plan 025) — present only when windows are
    // configured. In-peak means the provider is demoted in routing.
    if (p.peak) {
      html += `<div class="section-title">Peak Pricing</div>`;
      const stCls = p.peak.in_peak ? 'token-crit' : '';
      html += `<div class="stat"><span class="k">state</span><span class="v ${stCls}">${p.peak.in_peak ? 'in peak (demoted)' : 'off-peak'}</span></div>`;
      if (p.peak.boundary_epoch != null) {
        const secs = Math.max(0, Math.floor(p.peak.boundary_epoch - Date.now()/1000));
        html += `<div class="stat"><span class="k">${p.peak.in_peak ? 'ends_in' : 'peak_in'}</span><span class="v">${fmtDuration(secs)}</span></div>`;
      }
      for (const w of (p.peak.windows || [])) {
        html += `<div class="stat"><span class="k">window</span><span class="v" style="font-size:0.8rem">${esc(w)}</span></div>`;
      }
    }

    // Per-provider speed (Plan 020 Wave 3)
    if (p.speed) {
      const sp = p.speed;
      const ttfb = sp.ttfb_ms || {};
      html += `<div class="section-title">Speed (${sp.samples} samples)</div>`;
      html += `<div class="stat"><span class="k">ttfb_avg</span><span class="v">${ttfb.avg != null ? Math.round(ttfb.avg) + 'ms' : '-'}</span></div>`;
      html += `<div class="stat"><span class="k">ttfb_p95</span><span class="v">${ttfb.p95 != null ? Math.round(ttfb.p95) + 'ms' : '-'}</span></div>`;
      html += `<div class="stat"><span class="k">duration_avg</span><span class="v">${(sp.duration_ms || {}).avg != null ? Math.round(sp.duration_ms.avg) + 'ms' : '-'}</span></div>`;
      html += `<div class="stat"><span class="k">tokens_per_sec</span><span class="v">${sp.tokens_per_sec != null ? sp.tokens_per_sec : '-'}</span></div>`;
    }

    html += `</div>`;
  });
  html += '</div>';

  // Estimator
  if (data.estimator) {
    const est = data.estimator;
    html += '<h2>Low-Interactivity Threshold Estimator</h2><div class="grid">';
    html += `<div class="card"><h3>Estimate</h3>`;
    html += `<div class="stat"><span class="k">edges_observed</span><span class="v">${est.edges}</span></div>`;
    const r = est.requests || {};
    const t = est.tokens || {};
    html += `<div class="stat"><span class="k">requests_lower</span><span class="v">${r.lower || '-'}</span></div>`;
    html += `<div class="stat"><span class="k">requests_upper</span><span class="v">${r.upper || '-'}</span></div>`;
    html += `<div class="stat"><span class="k">requests_best_guess</span><span class="v">${r.best_guess || '-'}</span></div>`;
    html += `<div class="stat"><span class="k">requests_contradicted</span><span class="v">${r.contradicted}</span></div>`;
    html += `<div class="stat"><span class="k">tokens_lower</span><span class="v">${fmtTokens(t.lower)}</span></div>`;
    html += `<div class="stat"><span class="k">tokens_upper</span><span class="v">${fmtTokens(t.upper)}</span></div>`;
    html += `<div class="stat"><span class="k">tokens_best_guess</span><span class="v">${fmtTokens(t.best_guess)}</span></div>`;
    html += `<div class="stat"><span class="k">tokens_contradicted</span><span class="v">${t.contradicted}</span></div>`;
    if (est.last_edge_concurrent_sessions != null) {
      html += `<div class="stat"><span class="k">last_edge_sessions</span><span class="v">${est.last_edge_concurrent_sessions}</span></div>`;
    }
    html += `</div></div>`;
  }

  // "default" is a reserved key in this payload, not a hashed route key —
  // it has its own editable section above, and truncating it here rendered a
  // phantom "default..." row alongside real keys.
  const keyedRoutes = Object.entries(data.route_table || {})
    .filter(([key]) => key !== 'default');
  html += '<h2>Keyed Routes</h2>';
  if (keyedRoutes.length === 0) {
    html += '<p style="color:var(--muted)">No keyed routes — all traffic '
         +  'follows the default route.</p>';
  } else {
    html += '<table><thead><tr><th>Key (truncated)</th><th>Providers</th><th></th></tr></thead><tbody>';
    keyedRoutes.forEach(([key, providers], i) => {
      html += `<tr><td><code>${esc(key.substring(0, 16))}...</code></td>`
           +  `<td>${providers.map(esc).join(' &rarr; ')}</td>`
           +  `<td><button id="del-route-${i}" class="mini-btn">Delete</button></td></tr>`;
    });
    html += '</tbody></table>';
  }

  // Model Map — the operator question is "who can serve this model", so the
  // matrix shows every configured provider per model, with the alias filled in
  // or a dash where the provider lacks one.
  const mm = data.model_map || {};
  const mmModels = Object.keys(mm);
  const allProviders = Object.keys(data.providers || {}).sort();
  html += '<h2>Model Map</h2>';
  if (mmModels.length === 0) {
    html += '<p style="color:var(--muted)">No models mapped.</p>';
  } else {
    html += '<table><thead><tr><th>Model</th>';
    for (const pn of allProviders) {
      html += `<th>${esc(pn)}</th>`;
    }
    html += '<th></th></tr></thead><tbody>';
    mmModels.sort().forEach((model, mi) => {
      const aliases = mm[model] || {};
      html += `<tr><td><code>${esc(model)}</code></td>`;
      for (const pn of allProviders) {
        const alias = aliases[pn];
        if (alias != null) {
          html += `<td style="color:var(--green)">${esc(alias)}</td>`;
        } else {
          html += `<td style="color:var(--muted)">&mdash;</td>`;
        }
      }
      html += `<td><button id="edit-model-${mi}" class="mini-btn">Edit</button>
        <button id="del-model-${mi}" class="mini-btn">Delete</button></td></tr>`;
    });
    html += '</tbody></table>';
  }

  html += renderConfig(cfg);

  // Quarantine (Plan 023 WI-4 dashboard panel). Shows quarantined pairs with
  // their evidence and a Release button. The status.json payload already
  // carries quarantine.entries; this just renders them. Releasing is an
  // explicit operator action — DELETE /admin/quarantine/<provider>/<model>.
  const q = data.quarantine;
  if (q && q.entries && q.entries.length) {
    html += '<h2>Quarantine</h2>';
    html += `<p style="margin:0 0 0.6rem;color:var(--muted);font-size:0.85rem">`
         +  `Pairs taken out of service after ${q.threshold} consecutive`
         +  ` provider-attributed failures. Release is a human decision.</p>`;
    html += '<table><thead><tr><th>Provider</th><th>Model</th>'
         +  '<th>Failures</th><th>Last status</th><th>Detail</th><th></th>'
         +  '</tr></thead><tbody>';
    q.entries.forEach((entry, qi) => {
      const statusTxt = entry.last_status != null
        ? String(entry.last_status)
        : '<span style="color:var(--muted)">&mdash;</span>';
      const detailTxt = entry.last_detail
        ? esc(entry.last_detail)
        : '<span style="color:var(--muted)">&mdash;</span>';
      html += `<tr>`
           +  `<td>${esc(entry.provider)}</td>`
           +  `<td><code>${esc(entry.model)}</code></td>`
           +  `<td>${entry.failures}</td>`
           +  `<td>${statusTxt}</td>`
           +  `<td style="font-size:0.8rem">${detailTxt}</td>`
           +  `<td><button id="rel-q-${qi}" class="mini-btn">Release</button></td>`
           +  `</tr>`;
    });
    html += '</tbody></table>';
  }

  const m = data.routing_metrics || {};
  html += '<h2>Routing Metrics</h2><div class="grid">';
  html += `<div class="card"><h3>Decisions</h3>
    <div class="stat"><span class="k">routing_decisions</span><span class="v">${m.routing_decisions || 0}</span></div>
    <div class="stat"><span class="k">failovers</span><span class="v">${m.failovers || 0}</span></div>
  </div>`;
  const fpp = m.forwarded_per_provider || {};
  html += `<div class="card"><h3>Forwarded per Provider</h3>`;
  for (const [name, count] of Object.entries(fpp)) {
    html += `<div class="stat"><span class="k">${esc(name)}</span><span class="v">${count}</span></div>`;
  }
  html += '</div></div>';

  el.innerHTML = html;

  // Wire per-row Delete buttons now that the table HTML is in the DOM. The
  // 5 s poll rebuilds #app and re-runs this, so no stale-handler problem.
  // The per-card Edit buttons follow the same pattern (Plan 020 WI-6).
  provNames.forEach((name, i) => {
    const btn = document.getElementById('edit-prov-' + i);
    if (btn) btn.onclick = () => editProvider(name);
  });
  keyedRoutes.forEach(([key], i) => {
    const btn = document.getElementById('del-route-' + i);
    if (btn) btn.onclick = () => deleteRoute(key);
  });
  mmModels.slice().sort().forEach((model, mi) => {
    const btn = document.getElementById('del-model-' + mi);
    if (btn) btn.onclick = () => deleteModel(model);
    const ebtn = document.getElementById('edit-model-' + mi);
    if (ebtn) ebtn.onclick = () => {
      scanPinned = false;
      editingModel = true;
      renderModelAddForm(allProviders, model, mm[model] || {});
    };
  });
  // Wire quarantine Release buttons (Plan 023 WI-4).
  if (q && q.entries) {
    q.entries.forEach((entry, qi) => {
      const btn = document.getElementById('rel-q-' + qi);
      if (btn) btn.onclick = () => releaseQuarantine(entry.provider, entry.model);
    });
  }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
