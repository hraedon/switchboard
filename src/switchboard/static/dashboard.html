<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>switchboard</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --border: #2a2e3a;
  --text: #e0e0e0;
  --muted: #888;
  --accent: #5b8def;
  --green: #4caf50;
  --amber: #ff9800;
  --red: #f44336;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 1.5rem;
}
h1 { font-size: 1.4rem; margin: 0 0 1rem; }
h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; color: var(--muted); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
}
.card h3 { margin: 0 0 0.5rem; font-size: 1rem; }
.stat { display: flex; justify-content: space-between; padding: 0.2rem 0; }
.stat .k { color: var(--muted); }
.stat .v { font-variant-numeric: tabular-nums; }
.badge {
  display: inline-block;
  padding: 0.1rem 0.4rem;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge.open { background: var(--green); color: #fff; }
.badge.saturated { background: var(--amber); color: #fff; }
.badge.boxed, .badge.breaker, .badge.low_interactivity { background: var(--red); color: #fff; }
.badge.unknown { background: var(--muted); color: #fff; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
a { color: var(--accent); }
.form-row { margin: 0.5rem 0; }
.form-row label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.2rem; }
.form-row input, .form-row select {
  width: 100%;
  padding: 0.4rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
}
button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 4px;
  cursor: pointer;
}
.mini-btn {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 0.2rem 0.5rem;
  font-size: 0.78rem;
}
.mini-btn:hover { color: var(--red); border-color: var(--red); }
.section-title {
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0.8rem 0 0.3rem;
  border-top: 1px solid var(--border);
  padding-top: 0.6rem;
}
.token-val { font-weight: 600; }
.token-warn { color: var(--amber); }
.token-crit { color: var(--red); }
</style>
</head>
<body>
<h1>switchboard</h1>
<div id="default-route"></div>
<div id="add-provider"></div>
<div id="route-add"></div>
<div id="model-add"></div>
<div id="app">Loading...</div>
<script>
// The default route is the only control on this page that WRITES, so it lives
// outside #app: the 5 s poll replaces #app wholesale and would wipe a
// half-typed edit. `editingDefault` additionally freezes this section while a
// form is open, so a poll landing mid-edit cannot discard what was typed.
let editingDefault = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function renderDefaultRoute(data) {
  if (editingDefault) return;
  const el = document.getElementById('default-route');
  const current = (data.route_table || {})['default'] || [];
  const known = Object.keys(data.providers || {}).sort();
  el.innerHTML = `
    <h2>Default Route</h2>
    <div class="card">
      <p style="margin:0 0 0.6rem;color:var(--muted);font-size:0.85rem">
        Where requests go when no route key matches, in preference order.
        A provider that no route names is never selected &mdash; the model map
        filters a route's candidates, it never adds to them.
      </p>
      <div class="stat">
        <span class="k">current</span>
        <span class="v">${current.length ? esc(current.join(' → ')) : '<em>none</em>'}</span>
      </div>
      <div style="margin-top:0.6rem">
        <button id="edit-default">Edit</button>
      </div>
    </div>`;
  document.getElementById('edit-default').onclick = () => {
    editingDefault = true;
    renderDefaultRouteForm(current, known);
  };
}

function renderDefaultRouteForm(current, known) {
  const el = document.getElementById('default-route');
  el.innerHTML = `
    <h2>Default Route</h2>
    <div class="card">
      <div class="form-row">
        <label for="default-input">
          Providers, comma-separated, most preferred first
        </label>
        <input id="default-input" list="known-providers"
               value="${esc(current.join(', '))}" autocomplete="off">
        <datalist id="known-providers">
          ${known.map(n => `<option value="${esc(n)}">`).join('')}
        </datalist>
      </div>
      <p style="margin:0.3rem 0 0.6rem;color:var(--muted);font-size:0.8rem">
        Configured: ${known.length ? known.map(esc).join(', ') : '<em>none</em>'}
      </p>
      <div id="default-error" style="color:var(--red);font-size:0.85rem;
           margin-bottom:0.5rem"></div>
      <button id="save-default">Save</button>
      <button id="cancel-default"
              style="background:transparent;border:1px solid var(--border)">
        Cancel
      </button>
    </div>`;

  document.getElementById('cancel-default').onclick = () => {
    editingDefault = false;
    load();
  };

  document.getElementById('save-default').onclick = async () => {
    const raw = document.getElementById('default-input').value;
    const providers = raw.split(',').map(s => s.trim()).filter(s => s);
    const errEl = document.getElementById('default-error');
    errEl.textContent = '';
    try {
      // Same-origin fetch: the browser attaches the session cookie and
      // Sec-Fetch-Site: same-origin, which is what the CSRF check wants.
      const resp = await fetch('/admin/routes/default', {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ providers }),
      });
      const body = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        // Surface the server's message verbatim — it names the offending
        // provider, which is the whole reason validation lives server-side.
        errEl.textContent = body.error || `request failed (${resp.status})`;
        return;
      }
      if (body.persisted === false) {
        errEl.style.color = 'var(--amber)';
        errEl.textContent =
          'Saved, but not persisted: no route table store is configured, ' +
          'so this reverts on restart.';
        setTimeout(() => { editingDefault = false; load(); }, 4000);
        return;
      }
      editingDefault = false;
      load();
    } catch (e) {
      errEl.textContent = String(e);
    }
  };
}

// ── Add Provider form (Plan 021 WI-5) ────────────────────────────────────
// Lives outside #app for the same reason the default-route editor does: the
// 5 s poll rebuilds #app wholesale and would wipe a half-filled form.
// `editingProvider` freezes this section while the form is open, so a poll
// landing mid-edit cannot discard what was typed.
let editingProvider = false;
let registryCache = null;

function renderAddProvider(_data) {
  if (editingProvider) return;
  const el = document.getElementById('add-provider');
  el.innerHTML = `
    <h2>Providers</h2>
    <div class="card">
      <p style="margin:0 0 0.6rem;color:var(--muted);font-size:0.85rem">
        Add a provider by pasting the vendor's documented base URL. Pick a
        registry entry to pre-fill, or use &ldquo;generic&rdquo; and type it.
      </p>
      <button id="add-provider-btn">Add provider</button>
    </div>`;
  const btn = document.getElementById('add-provider-btn');
  if (btn) btn.onclick = () => { editingProvider = true; renderProviderForm(); };
}

async function _loadRegistry() {
  if (registryCache) return registryCache;
  try {
    const resp = await fetch('/admin/providers/registry', { credentials: 'same-origin' });
    if (resp.ok) registryCache = (await resp.json()).providers || [];
  } catch (e) { registryCache = []; }
  return registryCache || [];
}

function renderProviderForm() {
  const el = document.getElementById('add-provider');
  el.innerHTML = `
    <h2>Add Provider</h2>
    <div class="card">
      <div class="form-row">
        <label for="pf-registry">From registry (optional)</label>
        <select id="pf-registry"><option value="">loading…</option></select>
      </div>
      <div class="form-row">
        <label for="pf-name">Name</label>
        <input id="pf-name" autocomplete="off" placeholder="e.g. ollama-cloud">
      </div>
      <div class="form-row">
        <label for="pf-base">Base URL (vendor documented API root)</label>
        <input id="pf-base" autocomplete="off" placeholder="e.g. https://ollama.com/v1">
      </div>
      <div class="form-row">
        <label>Live preview (composed upstream for /v1/chat/completions)</label>
        <code id="pf-preview" style="display:block;background:var(--bg);padding:0.4rem 0.5rem;
          border-radius:4px;font-size:0.82rem;color:var(--muted);min-height:1.2em"></code>
      </div>
      <div class="form-row">
        <label for="pf-target">Target concurrency</label>
        <input id="pf-target" type="number" min="1" value="1" style="width:6rem">
      </div>
      <div class="form-row">
        <label for="pf-auth-header">Auth header</label>
        <input id="pf-auth-header" value="authorization" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="pf-key-env">API key env var (name only — value stays server-side)</label>
        <input id="pf-key-env" autocomplete="off" placeholder="e.g. SWITCHBOARD_OLLAMA_KEY">
      </div>
      <div id="pf-discover" style="margin:0.3rem 0 0.6rem;font-size:0.82rem"></div>
      <div id="pf-error" style="color:var(--red);font-size:0.85rem;margin-bottom:0.5rem"></div>
      <button id="pf-test">Test &amp; detect</button>
      <button id="pf-save">Save</button>
      <button id="pf-cancel" style="background:transparent;border:1px solid var(--border)">Cancel</button>
    </div>`;

  document.getElementById('pf-cancel').onclick = () => {
    editingProvider = false; load();
  };
  const regSel = document.getElementById('pf-registry');
  regSel.onchange = () => _applyRegistryPick(regSel.value);
  const baseInput = document.getElementById('pf-base');
  let previewTimer = null;
  baseInput.oninput = () => {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(_refreshPreview, 150);
  };
  document.getElementById('pf-test').onclick = _runDiscover;
  document.getElementById('pf-save').onclick = _saveProvider;

  // Populate the registry picker, then seed defaults from "generic".
  _loadRegistry().then(entries => {
    const opts = ['<option value="">— pick to pre-fill, or type below —</option>'];
    for (const e of entries) {
      opts.push(`<option value="${esc(e.name)}">${esc(e.name)}${
        e.default_base_url ? ' — ' + esc(e.default_base_url) : ''
      }</option>`);
    }
    regSel.innerHTML = opts.join('');
  });
}

function _applyRegistryPick(name) {
  if (!registryCache) return;
  const entry = registryCache.find(e => e.name === name);
  if (!entry) return;
  if (entry.default_base_url) document.getElementById('pf-base').value = entry.default_base_url;
  if (entry.auth_header) document.getElementById('pf-auth-header').value = entry.auth_header;
  if (!document.getElementById('pf-name').value) document.getElementById('pf-name').value = name;
  _refreshPreview();
}

async function _refreshPreview() {
  const base = (document.getElementById('pf-base') || {}).value || '';
  const out = document.getElementById('pf-preview');
  if (!out) return;
  if (!base.trim()) { out.textContent = ''; return; }
  try {
    const q = new URLSearchParams({ base, path: '/v1/chat/completions' });
    const resp = await fetch('/admin/preview-path?' + q, { credentials: 'same-origin' });
    if (resp.ok) {
      const data = await resp.json();
      out.textContent = data.composed || '';
    }
  } catch (e) { /* preview is best-effort */ }
}

async function _runDiscover() {
  const base = (document.getElementById('pf-base') || {}).value || '';
  const out = document.getElementById('pf-discover');
  const errEl = document.getElementById('pf-error');
  errEl.textContent = '';
  if (!base.trim()) { errEl.textContent = 'enter a base URL first'; return; }
  out.innerHTML = '<span style="color:var(--muted)">probing…</span>';
  try {
    // No credential is sent: the key lives in a server-side env var the
    // browser never sees. Public /models endpoints answer; auth-gated ones
    // report 401/403 — the composition is still discoverable from the URL
    // that was tried. After saving, the per-provider Test uses the credential.
    const resp = await fetch('/admin/providers/discover', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ base_url: base.trim() }),
    });
    const data = await resp.json();
    if (!resp.ok) { errEl.textContent = data.error || ('HTTP ' + resp.status); return; }
    const rows = (data.candidates || []).map(c => {
      const mark = c.ok ? '✓' : (c.status ? '✗' : '·');
      const color = c.ok ? 'var(--green)' : 'var(--muted)';
      const st = c.ok ? 'ok' : (c.detail || (c.status != null ? c.status : 'no response'));
      return `<div style="color:${color}">${mark} <code>${esc(c.url)}</code> — ${esc(st)}</div>`;
    });
    const okCount = (data.candidates || []).filter(c => c.ok).length;
    out.innerHTML = `<div style="margin-bottom:0.3rem">${okCount} answered</div>${rows.join('')}`;
  } catch (e) { errEl.textContent = String(e); }
}

async function _saveProvider() {
  const name = (document.getElementById('pf-name') || {}).value.trim();
  const upstream = (document.getElementById('pf-base') || {}).value.trim();
  const target = parseInt((document.getElementById('pf-target') || {}).value, 10) || 1;
  const auth_header = (document.getElementById('pf-auth-header') || {}).value.trim() || 'authorization';
  const api_key_env = (document.getElementById('pf-key-env') || {}).value.trim();
  const errEl = document.getElementById('pf-error');
  errEl.textContent = '';
  if (!name) { errEl.textContent = 'name is required'; return; }
  if (!upstream) { errEl.textContent = 'base URL is required'; return; }
  const body = { name, upstream, provider_type: 'generic', target, auth_header };
  if (api_key_env) { body.key_mode = 'env'; body.api_key_env = api_key_env; }
  try {
    const resp = await fetch('/admin/providers', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) { errEl.textContent = data.error || ('HTTP ' + resp.status); return; }
    editingProvider = false;
    load();
  } catch (e) { errEl.textContent = String(e); }
}

// ── Keyed-route management (Plan 020 WI-8) ────────────────────────────────
let editingRoute = false;

function renderRouteAdd(_data) {
  if (editingRoute) return;
  const el = document.getElementById('route-add');
  el.innerHTML = `
    <h2>Keyed Routes</h2>
    <div class="card">
      <p style="margin:0 0 0.6rem;color:var(--muted);font-size:0.85rem">
        Route a specific API key to a fixed provider list. Unmatched traffic
        follows the default route.
      </p>
      <button id="add-route-btn">Add keyed route</button>
    </div>`;
  const btn = document.getElementById('add-route-btn');
  if (btn) btn.onclick = () => { editingRoute = true; renderRouteAddForm(); };
}

function renderRouteAddForm() {
  const el = document.getElementById('route-add');
  el.innerHTML = `
    <h2>Add Keyed Route</h2>
    <div class="card">
      <div class="form-row">
        <label for="rf-key">API key (raw — hashed server-side, never stored in clear)</label>
        <input id="rf-key" autocomplete="off" placeholder="sk-...">
      </div>
      <div class="form-row">
        <label for="rf-providers">Providers, comma-separated, most preferred first</label>
        <input id="rf-providers" autocomplete="off" placeholder="umans, ollama-cloud">
      </div>
      <div id="rf-error" style="color:var(--red);font-size:0.85rem;margin-bottom:0.5rem"></div>
      <button id="rf-save">Save</button>
      <button id="rf-cancel" style="background:transparent;border:1px solid var(--border)">Cancel</button>
    </div>`;
  document.getElementById('rf-cancel').onclick = () => { editingRoute = false; load(); };
  document.getElementById('rf-save').onclick = async () => {
    const key = (document.getElementById('rf-key') || {}).value || '';
    const raw = (document.getElementById('rf-providers') || {}).value || '';
    const providers = raw.split(',').map(s => s.trim()).filter(s => s);
    const errEl = document.getElementById('rf-error');
    errEl.textContent = '';
    if (!key.trim()) { errEl.textContent = 'API key is required'; return; }
    if (!providers.length) { errEl.textContent = 'at least one provider is required'; return; }
    try {
      const resp = await fetch('/admin/routes', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ key: key.trim(), providers }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) { errEl.textContent = data.error || ('HTTP ' + resp.status); return; }
      editingRoute = false; load();
    } catch (e) { errEl.textContent = String(e); }
  };
}

async function deleteRoute(key) {
  if (!confirm('Delete this keyed route?')) return;
  try {
    const resp = await fetch('/admin/routes/' + encodeURIComponent(key), {
      method: 'DELETE', credentials: 'same-origin',
    });
    if (!resp.ok) {
      const b = await resp.json().catch(() => ({}));
      alert(b.error || ('HTTP ' + resp.status));
      return;
    }
    load();
  } catch (e) { alert(String(e)); }
}

// ── Model-map management (Plan 020 WI-7) ──────────────────────────────────
let editingModel = false;

function renderModelAdd(data) {
  if (editingModel) return;
  const known = Object.keys((data && data.providers) || {}).sort();
  const el = document.getElementById('model-add');
  el.innerHTML = `
    <h2>Model Map</h2>
    <div class="card">
      <p style="margin:0 0 0.6rem;color:var(--muted);font-size:0.85rem">
        Map a model name to per-provider aliases. Only providers with an alias
        can serve the model; the alias is what gets sent upstream.
      </p>
      <button id="add-model-btn">Add model mapping</button>
    </div>`;
  const btn = document.getElementById('add-model-btn');
  if (btn) btn.onclick = () => { editingModel = true; renderModelAddForm(known); };
}

function renderModelAddForm(knownProviders) {
  const el = document.getElementById('model-add');
  const provs = (knownProviders || []).slice().sort();
  const aliasRows = provs.map(p => `
    <div class="form-row">
      <label for="mf-alias-${esc(p)}">${esc(p)} alias</label>
      <input id="mf-alias-${esc(p)}" autocomplete="off" placeholder="leave blank if ${esc(p)} does not serve it">
    </div>`).join('');
  el.innerHTML = `
    <h2>Add Model Mapping</h2>
    <div class="card">
      <div class="form-row">
        <label for="mf-model">Model name (as the client sends it)</label>
        <input id="mf-model" autocomplete="off" placeholder="e.g. glm-5.2">
      </div>
      ${aliasRows || '<p style="color:var(--muted)">No providers configured.</p>'}
      <div id="mf-error" style="color:var(--red);font-size:0.85rem;margin-bottom:0.5rem"></div>
      <button id="mf-save">Save</button>
      <button id="mf-cancel" style="background:transparent;border:1px solid var(--border)">Cancel</button>
    </div>`;
  document.getElementById('mf-cancel').onclick = () => { editingModel = false; load(); };
  document.getElementById('mf-save').onclick = async () => {
    const model = (document.getElementById('mf-model') || {}).value.trim();
    const errEl = document.getElementById('mf-error');
    errEl.textContent = '';
    if (!model) { errEl.textContent = 'model name is required'; return; }
    const aliases = {};
    for (const p of provs) {
      const v = (document.getElementById('mf-alias-' + p) || {}).value.trim();
      if (v) aliases[p] = v;
    }
    if (!Object.keys(aliases).length) {
      errEl.textContent = 'fill in at least one provider alias';
      return;
    }
    try {
      const resp = await fetch('/admin/model-map', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ model, aliases }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) { errEl.textContent = data.error || ('HTTP ' + resp.status); return; }
      editingModel = false; load();
    } catch (e) { errEl.textContent = String(e); }
  };
}

async function deleteModel(model) {
  if (!confirm('Delete the mapping for ' + model + '?')) return;
  try {
    const resp = await fetch('/admin/model-map/' + encodeURIComponent(model), {
      method: 'DELETE', credentials: 'same-origin',
    });
    if (!resp.ok) {
      const b = await resp.json().catch(() => ({}));
      alert(b.error || ('HTTP ' + resp.status));
      return;
    }
    load();
  } catch (e) { alert(String(e)); }
}

// Configuration provenance (Plan 021 WI-7). Which tier owns each provider,
// and which fields an env var has taken over. Fields shown as env-locked are
// owned by a Deployment variable: editing them here (once an edit-provider
// form lands — Plan 020 WI-6) would be discarded at the next restart, so they
// must render as locked. The Add Provider form above is the first writing
// control this enables; the provenance it reports answers "why is this value
// what it is" without reading the Deployment.
function renderConfig(cfg) {
  if (!cfg) return '';
  let html = '<h2>Configuration</h2>';

  const unmatched = cfg.unmatched_env_overrides || [];
  if (unmatched.length) {
    // These are inert — they name no configured provider. Worth shouting
    // about anyway: the operator who set them believes a deployment controls
    // a field it does not, and the boot-time log line has long scrolled away.
    html += `<div class="card" style="border-color:var(--amber)">
      <h3 style="color:var(--amber)">Ignored environment overrides</h3>
      <p style="margin:0 0 0.5rem;color:var(--muted);font-size:0.85rem">
        These match no configured provider and had no effect. Usually a typo
        in the provider name.
      </p>
      ${unmatched.map(v => `<div class="stat"><span class="k">
        <code>${esc(v)}</code></span></div>`).join('')}
    </div>`;
  }

  const providers = cfg.providers || [];
  if (!providers.length) return html + '<p style="color:var(--muted)">No providers.</p>';

  html += '<table><thead><tr><th>Provider</th><th>Config source</th>'
       +  '<th>Set by environment</th></tr></thead><tbody>';
  for (const p of providers) {
    const locked = Object.keys(p.field_sources || {}).sort();
    const disabled = p.enabled === false;
    const name = disabled
      ? `<s style="color:var(--muted)">${esc(p.name)}</s> <span class="badge unknown">disabled</span>`
      : esc(p.name);
    const lockedCells = locked.length
      ? locked.map(f => `<code style="color:var(--amber)" title="Owned by an environment variable; a GUI edit would be discarded at restart">${esc(f)}</code> <span class="badge unknown" style="font-size:0.7rem">env</span>`).join(' ')
      : '<span style="color:var(--muted)">&mdash;</span>';
    html += `<tr><td>${name}</td><td>${esc(p.source || '?')}</td>`
         +  `<td>${lockedCells}</td></tr>`;
  }
  html += '</tbody></table>';
  html += `<p style="color:var(--muted);font-size:0.8rem;margin-top:0.4rem">
    Precedence is environment &rarr; stored (GUI) &rarr; config file. A field
    listed above is owned by an environment variable, so editing it here would
    be discarded at the next restart.
  </p>`;
  return html;
}

function fmtTokens(n) {
  if (n == null) return '-';
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'k';
  return String(n);
}
function fmtPct(f) {
  if (f == null) return '-';
  return (f*100).toFixed(1)+'%';
}
function fmtDuration(sec) {
  if (sec == null) return '-';
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  if(h>0) return h+'h '+m+'m';
  if(m>0) return m+'m '+s+'s';
  return s+'s';
}
async function load() {
  const resp = await fetch('/status.json');
  if (!resp.ok) {
    window.location.href = '/login';
    return;
  }
  const data = await resp.json();
  const el = document.getElementById('app');

  renderDefaultRoute(data);
  renderAddProvider(data);
  renderRouteAdd(data);
  renderModelAdd(data);

  // Separate surface from status.json, and optional: a dashboard served
  // without an admin token still renders everything else rather than failing
  // whole because one panel could not be fetched.
  let cfg = null;
  try {
    const cresp = await fetch('/admin/config/effective', {
      credentials: 'same-origin',
    });
    if (cresp.ok) cfg = await cresp.json();
  } catch (e) {
    cfg = null;
  }

  let html = '<h2>Providers</h2><div class="grid">';
  for (const [name, p] of Object.entries(data.providers || {})) {
    const reason = p.gate_closed_reason || 'open';
    const badgeCls = reason === 'open' ? 'open' : reason;
    html += `<div class="card">
      <h3>${name} <span class="badge ${badgeCls}">${reason}</span></h3>
      <div class="stat"><span class="k">effective_permits</span><span class="v">${p.effective_permits}</span></div>
      <div class="stat"><span class="k">in_flight</span><span class="v">${p.in_flight}</span></div>
      <div class="stat"><span class="k">queue_depth</span><span class="v">${p.queue_depth}</span></div>
      <div class="stat"><span class="k">ready</span><span class="v">${p.ready}</span></div>
      <div class="stat"><span class="k">total_429s</span><span class="v">${p.total_429s}</span></div>
      <div class="stat"><span class="k">total_requests_forwarded</span><span class="v">${p.total_requests_forwarded}</span></div>`;

    // Band / penalty
    if (p.band && p.band !== 'normal') {
      html += `<div class="section-title">Penalty</div>`;
      html += `<div class="stat"><span class="k">band</span><span class="v">${p.band}</span></div>`;
      if (p.penalty_started_at) {
        const elapsed = Math.floor(Date.now()/1000 - p.penalty_started_at);
        html += `<div class="stat"><span class="k">penalty_age</span><span class="v">${fmtDuration(elapsed)}</span></div>`;
      }
      if (p.low_interactivity) {
        html += `<div class="stat"><span class="k">low_interactivity</span><span class="v token-crit">yes</span></div>`;
        if (p.service_mode_resets_at) {
          const remaining = Math.max(0, Math.floor(p.service_mode_resets_at - Date.now()/1000));
          html += `<div class="stat"><span class="k">resets_in</span><span class="v">${fmtDuration(remaining)}</span></div>`;
        }
      }
    }

    // Token budget (streaming-tracked)
    if (p.token_budget) {
      const tb = p.token_budget;
      html += `<div class="section-title">Token Budget (streaming-tracked)</div>`;
      html += `<div class="stat"><span class="k">cap</span><span class="v">${fmtTokens(tb.cap_tokens)}</span></div>`;
      html += `<div class="stat"><span class="k">own_in_window</span><span class="v">${fmtTokens(tb.own_tokens_in_window)}</span></div>`;
      html += `<div class="stat"><span class="k">provider_wide</span><span class="v">${fmtTokens(tb.provider_wide_tokens)}</span></div>`;
      const util = tb.projected_utilization;
      const cls = util != null && util >= 0.85 ? 'token-crit' : (util != null && util >= 0.7 ? 'token-warn' : '');
      html += `<div class="stat"><span class="k">projected_util</span><span class="v ${cls}">${fmtPct(util)}</span></div>`;
    }

    // Usage history (poll-based)
    if (p.usage_history) {
      const uh = p.usage_history;
      html += `<div class="section-title">Usage History (poll-based)</div>`;
      const t24 = uh.tokens_24h;
      const cls24 = t24 != null && t24 >= 350e6 ? 'token-crit' : (t24 != null && t24 >= 250e6 ? 'token-warn' : '');
      html += `<div class="stat"><span class="k">tokens_24h</span><span class="v token-val ${cls24}">${fmtTokens(t24)}</span></div>`;
      html += `<div class="stat"><span class="k">24h_in</span><span class="v">${fmtTokens(uh.tokens_24h_in)}</span></div>`;
      html += `<div class="stat"><span class="k">24h_out</span><span class="v">${fmtTokens(uh.tokens_24h_out)}</span></div>`;
      html += `<div class="stat"><span class="k">24h_requests</span><span class="v">${uh.tokens_24h_requests || '-'}</span></div>`;

      if (uh.penalty) {
        const pen = uh.penalty;
        html += `<div class="section-title">Penalty Event Tokens</div>`;
        html += `<div class="stat"><span class="k">24h_before</span><span class="v">${fmtTokens(pen.before_total)}</span></div>`;
        html += `<div class="stat"><span class="k">before_reqs</span><span class="v">${pen.before_requests || '-'}</span></div>`;
        html += `<div class="stat"><span class="k">since_penalty</span><span class="v token-val">${fmtTokens(pen.since_total)}</span></div>`;
        html += `<div class="stat"><span class="k">since_reqs</span><span class="v">${pen.since_requests || '-'}</span></div>`;
      }
    }

    // Tokens from usage reading
    if (p.tokens_in != null || p.tokens_out != null) {
      html += `<div class="section-title">Usage Reading</div>`;
      html += `<div class="stat"><span class="k">tokens_in</span><span class="v">${fmtTokens(p.tokens_in)}</span></div>`;
      html += `<div class="stat"><span class="k">tokens_out</span><span class="v">${fmtTokens(p.tokens_out)}</span></div>`;
    }

    // Per-provider speed (Plan 020 Wave 3)
    if (p.speed) {
      const sp = p.speed;
      const ttfb = sp.ttfb_ms || {};
      html += `<div class="section-title">Speed (${sp.samples} samples)</div>`;
      html += `<div class="stat"><span class="k">ttfb_avg</span><span class="v">${ttfb.avg != null ? Math.round(ttfb.avg) + 'ms' : '-'}</span></div>`;
      html += `<div class="stat"><span class="k">ttfb_p95</span><span class="v">${ttfb.p95 != null ? Math.round(ttfb.p95) + 'ms' : '-'}</span></div>`;
      html += `<div class="stat"><span class="k">duration_avg</span><span class="v">${(sp.duration_ms || {}).avg != null ? Math.round(sp.duration_ms.avg) + 'ms' : '-'}</span></div>`;
      html += `<div class="stat"><span class="k">tokens_per_sec</span><span class="v">${sp.tokens_per_sec != null ? sp.tokens_per_sec : '-'}</span></div>`;
    }

    html += `</div>`;
  }
  html += '</div>';

  // Estimator
  if (data.estimator) {
    const est = data.estimator;
    html += '<h2>Low-Interactivity Threshold Estimator</h2><div class="grid">';
    html += `<div class="card"><h3>Estimate</h3>`;
    html += `<div class="stat"><span class="k">edges_observed</span><span class="v">${est.edges}</span></div>`;
    const r = est.requests || {};
    const t = est.tokens || {};
    html += `<div class="stat"><span class="k">requests_lower</span><span class="v">${r.lower || '-'}</span></div>`;
    html += `<div class="stat"><span class="k">requests_upper</span><span class="v">${r.upper || '-'}</span></div>`;
    html += `<div class="stat"><span class="k">requests_best_guess</span><span class="v">${r.best_guess || '-'}</span></div>`;
    html += `<div class="stat"><span class="k">requests_contradicted</span><span class="v">${r.contradicted}</span></div>`;
    html += `<div class="stat"><span class="k">tokens_lower</span><span class="v">${fmtTokens(t.lower)}</span></div>`;
    html += `<div class="stat"><span class="k">tokens_upper</span><span class="v">${fmtTokens(t.upper)}</span></div>`;
    html += `<div class="stat"><span class="k">tokens_best_guess</span><span class="v">${fmtTokens(t.best_guess)}</span></div>`;
    html += `<div class="stat"><span class="k">tokens_contradicted</span><span class="v">${t.contradicted}</span></div>`;
    if (est.last_edge_concurrent_sessions != null) {
      html += `<div class="stat"><span class="k">last_edge_sessions</span><span class="v">${est.last_edge_concurrent_sessions}</span></div>`;
    }
    html += `</div></div>`;
  }

  // "default" is a reserved key in this payload, not a hashed route key —
  // it has its own editable section above, and truncating it here rendered a
  // phantom "default..." row alongside real keys.
  const keyedRoutes = Object.entries(data.route_table || {})
    .filter(([key]) => key !== 'default');
  html += '<h2>Keyed Routes</h2>';
  if (keyedRoutes.length === 0) {
    html += '<p style="color:var(--muted)">No keyed routes — all traffic '
         +  'follows the default route.</p>';
  } else {
    html += '<table><thead><tr><th>Key (truncated)</th><th>Providers</th><th></th></tr></thead><tbody>';
    keyedRoutes.forEach(([key, providers], i) => {
      html += `<tr><td><code>${esc(key.substring(0, 16))}...</code></td>`
           +  `<td>${providers.join(' &rarr; ')}</td>`
           +  `<td><button id="del-route-${i}" class="mini-btn">Delete</button></td></tr>`;
    });
    html += '</tbody></table>';
  }

  // Model Map — the operator question is "who can serve this model", so the
  // matrix shows every configured provider per model, with the alias filled in
  // or a dash where the provider lacks one.
  const mm = data.model_map || {};
  const mmModels = Object.keys(mm);
  const allProviders = Object.keys(data.providers || {}).sort();
  html += '<h2>Model Map</h2>';
  if (mmModels.length === 0) {
    html += '<p style="color:var(--muted)">No models mapped.</p>';
  } else {
    html += '<table><thead><tr><th>Model</th>';
    for (const pn of allProviders) {
      html += `<th>${esc(pn)}</th>`;
    }
    html += '<th></th></tr></thead><tbody>';
    mmModels.sort().forEach((model, mi) => {
      const aliases = mm[model] || {};
      html += `<tr><td><code>${esc(model)}</code></td>`;
      for (const pn of allProviders) {
        const alias = aliases[pn];
        if (alias != null) {
          html += `<td style="color:var(--green)">${esc(alias)}</td>`;
        } else {
          html += `<td style="color:var(--muted)">&mdash;</td>`;
        }
      }
      html += `<td><button id="del-model-${mi}" class="mini-btn">Delete</button></td></tr>`;
    });
    html += '</tbody></table>';
  }

  html += renderConfig(cfg);

  const m = data.routing_metrics || {};
  html += '<h2>Routing Metrics</h2><div class="grid">';
  html += `<div class="card"><h3>Decisions</h3>
    <div class="stat"><span class="k">routing_decisions</span><span class="v">${m.routing_decisions || 0}</span></div>
    <div class="stat"><span class="k">failovers</span><span class="v">${m.failovers || 0}</span></div>
  </div>`;
  const fpp = m.forwarded_per_provider || {};
  html += `<div class="card"><h3>Forwarded per Provider</h3>`;
  for (const [name, count] of Object.entries(fpp)) {
    html += `<div class="stat"><span class="k">${name}</span><span class="v">${count}</span></div>`;
  }
  html += '</div></div>';

  el.innerHTML = html;

  // Wire per-row Delete buttons now that the table HTML is in the DOM. The
  // 5 s poll rebuilds #app and re-runs this, so no stale-handler problem.
  keyedRoutes.forEach(([key], i) => {
    const btn = document.getElementById('del-route-' + i);
    if (btn) btn.onclick = () => deleteRoute(key);
  });
  mmModels.slice().sort().forEach((model, mi) => {
    const btn = document.getElementById('del-model-' + mi);
    if (btn) btn.onclick = () => deleteModel(model);
  });
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
