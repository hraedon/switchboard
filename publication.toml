# Publication plumbing declaration (canonical template).
#
# Read by githooks/pre-push via scripts/check_publication_plumbing.py before any
# push. The content denylist answers "may these bytes be published"; this file
# answers "may this repository be published HERE, by THIS identity, at THIS
# visibility" — the accident class content scanning cannot see.
#
# Keep this in sync with reality in the SAME commit that changes reality. If a
# publication review clears the repo for public release, flip `visibility` to
# "public" as part of that change, not afterwards.
#
# Honest scope: a git hook is layer 3/4 accident prevention, not a security
# boundary. CI is the hard gate.

[publication]
# Expected owner of the push URL. A push to any other owner is refused.
remote_owner = "hraedon"

# Expected author identity on every commit being pushed. Guards the
# multi-identity-box accident: right code, wrong signature. May be a single
# address or a list — real history often carries more than one (a web-UI commit
# lands as <user>@users.noreply.github.com). List every identity legitimate for
# this repo; anything else refuses the push.
author_email = ["plm@hraedon.com"]

# "private-until-review" | "public"
#
# private-until-review: the guard refuses the push if the remote is NOT private,
# so a repository awaiting publication review cannot reach a public remote by
# accident. This is the correct default for a new project.
#
# public: the repo has been cleared by a publication review.
#
# CI runs scripts/check_committed_identifiers.py with --ci on every push and
# pull request. In that mode this declaration is part of the hard gate: missing,
# malformed, or unknown publication settings fail closed, and a public repo also
# requires a configured, non-empty, usable denylist secret. Repository code can
# validate configuration and usability, not prove where the secret came from.
# Provision SWITCHBOARD_FORBIDDEN_IDENTIFIERS from the canonical denylist source
# via the publication-prep procedure. The always-on samples/ guard remains active
# independently of that secret.
#
# Pull requests use pull_request_target so the gate runs scanner and plumbing
# code from the trusted base branch with the configured secret. Contributor
# commits are fetched and scanned as git objects only: no contributor-controlled
# script, workflow, or checked-out file is executed. Local hook invocations
# without --ci retain their no-secret skip behavior for fresh clones.
#
# This repo's trusted PR gate additionally requires the scanner's --tree mode,
# all-blob raw-byte matching, control-safe commit-message reads, and redacted
# diagnostics. The shared
# sync-identifier-gate template is external to this repository. Before running
# that sync tool here, update its template to preserve these capabilities; the
# workflow and focused tests intentionally fail closed if an older template
# overwrites them.
visibility = "public"
