name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for committed work-domain identifiers
        env:
          SWITCHBOARD_FORBIDDEN_IDENTIFIERS: ${{ secrets.SWITCHBOARD_FORBIDDEN_IDENTIFIERS }}
        run: python scripts/check_committed_identifiers.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv
      # pyproject pins sluice to a SIBLING path so local work can test against
      # a local sluice. uv honours that source, and a CLI override does not
      # beat it — so the sibling has to exist here too. actions/checkout
      # refuses a path outside the workspace, hence a plain clone.
      - name: Check out sluice as a sibling (pyproject pins it by path)
        run: git clone --depth 1 https://github.com/hraedon/sluice.git ../sluice
      - name: Install switchboard + sluice + dev deps
        run: uv pip install -e ".[dev]"
      - name: ruff
        run: .venv/bin/ruff check .
      - name: mypy
        run: .venv/bin/mypy src
      - name: pytest
        run: .venv/bin/pytest -q
