name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv
      # pip is installed deliberately: test_wheel_install shells out to
      # `python -m pip wheel` to prove a clean install works, and a uv-created
      # venv has no pip.
      - name: Install switchboard + dev deps
        run: uv pip install -e ".[dev]" pip
      - name: ruff
        run: .venv/bin/ruff check .
      - name: mypy
        run: .venv/bin/mypy src
      - name: pytest
        run: .venv/bin/pytest -q
      # Plan 017 WI-10. In-process fake upstreams, no network. Kept out of
      # pytest deliberately: it asserts estate-level properties (no leaked
      # permits, no hung requests) under concurrent load, which is a slower
      # and coarser thing than a unit test, and it must stay runnable as one
      # command by an operator.
      - name: chaos harness
        run: .venv/bin/python scripts/chaos_harness.py
