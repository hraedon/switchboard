name: image
on:
  # Manual trigger: lets an operator republish without an empty commit,
  # and gives a deterministic way to publish when push events are not
  # producing runs.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run: a cancelled publish can leave a :sha
  # image pushed but unverified, which is exactly the state the verify step
  # exists to prevent. PR runs are still cancelled on a new push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Publishing is gated on a green test run in THIS workflow rather than on
  # branch protection alone. ci.yml already runs the matrix, so this repeats
  # roughly a minute of work on merges to main — cheap insurance for a
  # component that sits in the live request path, and it closes the direct-
  # push-to-main gap that branch protection would otherwise have to cover.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.13"
      - run: uv venv
      # Same sibling requirement as ci.yml: pyproject pins sluice by path, and
      # a CLI override does not beat a pyproject source.
      - name: Check out sluice as a sibling (pyproject pins it by path)
        run: git clone --depth 1 https://github.com/hraedon/sluice.git ../sluice
      # pip is installed deliberately: test_wheel_install shells out to
      # `python -m pip wheel` to prove a clean install works, and a uv-created
      # venv has no pip. Without it that test fails everywhere, which is how it
      # went unnoticed locally for a whole session.
      - name: Install switchboard + dev deps
        run: uv pip install -e ".[dev]" pip
      - name: pytest
        run: .venv/bin/pytest -q

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out switchboard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Must live INSIDE the workspace: actions/checkout rejects a `path`
      # outside GITHUB_WORKSPACE, so the sibling layout used locally cannot
      # be reproduced literally here. The Dockerfile does not care — a named
      # build context can point anywhere — so the workflow adapts to the
      # runner rather than the Dockerfile adapting to CI.
      - name: Check out sluice (public sibling dependency)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: hraedon/sluice
          path: _sluice
          persist-credentials: false

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on merge to main)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-contexts: sluice=${{ github.workspace }}/_sluice
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/hraedon/switchboard:${{ github.sha }}
            ghcr.io/hraedon/switchboard:main

      - name: Verify the installed switchboard is ours
        env:
          IMAGE: ghcr.io/hraedon/switchboard:${{ github.sha }}
        run: |
          expected=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          actual=$(docker run --rm --entrypoint python3 "$IMAGE" -c "import importlib.metadata as m; print(m.distribution('switchboard').version)")
          echo "pyproject.toml version: ${expected}"
          echo "installed version:      ${actual}"
          test "${expected}" = "${actual}"

          # sluice has the same public-namesake collision (ours 1.3.9 vs an
          # unrelated public 0.3.1) and today escapes it only by version
          # coincidence plus the by-file install. Assert it symmetrically
          # rather than relying on that coincidence holding.
          sluice_version=$(docker run --rm --entrypoint python3 "$IMAGE" -c "import importlib.metadata as m; print(m.distribution('sluice').version)")
          echo "installed sluice:       ${sluice_version}"
          case "${sluice_version}" in
            1.*) ;;
            *) echo "::error::sluice ${sluice_version} is not our 1.x package"; exit 1 ;;
          esac
