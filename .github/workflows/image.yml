name: image
on:
  workflow_run:
    workflows: [identifier-gate]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind authorization to canonical gate workflow and exact scan job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/authorize_image_gate_run.py
      - id: current
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(git rev-parse refs/remotes/origin/main)
          if [ "$current" = "$APPROVED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Approved commit is no longer main; image publication is skipped."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: authorize
    if: needs.authorize.outputs.current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.13"
      - run: uv venv
      # pip is installed deliberately: test_wheel_install shells out to
      # `python -m pip wheel` to prove a clean install works, and a uv-created
      # venv has no pip. Without it that test fails everywhere, which is how it
      # went unnoticed locally for a whole session.
      - name: Install switchboard + dev deps
        run: uv pip install -e ".[dev]" pip
      - name: pytest
        run: .venv/bin/pytest -q

  build-and-verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out switchboard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build approved main commit without publishing
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          outputs: type=docker,dest=/tmp/switchboard-image.tar
          tags: switchboard-verify:${{ github.event.workflow_run.head_sha }}

      - name: Verify the installed switchboard is ours
        env:
          IMAGE: switchboard-verify:${{ github.event.workflow_run.head_sha }}
        run: |
          docker load --input /tmp/switchboard-image.tar
          expected=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          actual=$(docker run --rm --entrypoint python3 "$IMAGE" -c "import importlib.metadata as m; print(m.distribution('switchboard').version)")
          echo "pyproject.toml version: ${expected}"
          echo "installed version:      ${actual}"
          test "${expected}" = "${actual}"

          # Plan 018 removed the sluice dependency. The public PyPI `sluice`
          # (an unrelated project) must never reappear in this image — its
          # presence would mean a dependency regression or a supply-chain
          # surprise, so assert absence rather than assuming it.
          docker run --rm --entrypoint python3 "$IMAGE" -c "
          import importlib.metadata as m
          try:
              v = m.distribution('sluice').version
          except m.PackageNotFoundError:
              print('sluice: absent, as required')
          else:
              raise SystemExit(f'sluice {v} is installed but the dependency was removed in Plan 018')
          "

      - name: Preserve verified image for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-switchboard-image
          path: /tmp/switchboard-image.tar
          if-no-files-found: error

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse stale approved commits
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(git rev-parse refs/remotes/origin/main)
          if [ "$current" != "$APPROVED_SHA" ]; then
            echo "::error::approved commit is no longer current main; refusing publication"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-switchboard-image
          path: /tmp
      - run: docker load --input /tmp/switchboard-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable approved image
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          target="ghcr.io/hraedon/switchboard:$APPROVED_SHA"
          docker tag "switchboard-verify:$APPROVED_SHA" "$target"
          docker push "$target"
