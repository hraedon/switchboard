name: image
on:
  # Manual trigger: lets an operator republish without an empty commit,
  # and gives a deterministic way to publish when push events are not
  # producing runs.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run: a cancelled publish can leave a :sha
  # image pushed but unverified, which is exactly the state the verify step
  # exists to prevent. PR runs are still cancelled on a new push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Publishing is gated on a green test run in THIS workflow rather than on
  # branch protection alone. ci.yml already runs the matrix, so this repeats
  # roughly a minute of work on merges to main — cheap insurance for a
  # component that sits in the live request path, and it closes the direct-
  # push-to-main gap that branch protection would otherwise have to cover.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.13"
      - run: uv venv
      # pip is installed deliberately: test_wheel_install shells out to
      # `python -m pip wheel` to prove a clean install works, and a uv-created
      # venv has no pip. Without it that test fails everywhere, which is how it
      # went unnoticed locally for a whole session.
      - name: Install switchboard + dev deps
        run: uv pip install -e ".[dev]" pip
      - name: pytest
        run: .venv/bin/pytest -q

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out switchboard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish on merge to main)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/hraedon/switchboard:${{ github.sha }}
            ghcr.io/hraedon/switchboard:main

      - name: Verify the installed switchboard is ours
        env:
          IMAGE: ghcr.io/hraedon/switchboard:${{ github.sha }}
        run: |
          expected=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          actual=$(docker run --rm --entrypoint python3 "$IMAGE" -c "import importlib.metadata as m; print(m.distribution('switchboard').version)")
          echo "pyproject.toml version: ${expected}"
          echo "installed version:      ${actual}"
          test "${expected}" = "${actual}"

          # Plan 018 removed the sluice dependency. The public PyPI `sluice`
          # (an unrelated project) must never reappear in this image — its
          # presence would mean a dependency regression or a supply-chain
          # surprise, so assert absence rather than assuming it.
          docker run --rm --entrypoint python3 "$IMAGE" -c "
          import importlib.metadata as m
          try:
              v = m.distribution('sluice').version
          except m.PackageNotFoundError:
              print('sluice: absent, as required')
          else:
              raise SystemExit(f'sluice {v} is installed but the dependency was removed in Plan 018')
          "
