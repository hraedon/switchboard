# switchboard — agent-delegation routing
#
# The shape this estate actually needs: opencode (and any other
# OpenAI-compatible client) points at switchboard instead of at a vendor, and
# switchboard decides which upstream serves each request. When one runs out of
# quota, the request moves rather than failing — which is the whole point, since
# a delegated review that dies on a 429 costs a whole round trip of human
# attention to notice and re-dispatch.
#
# Copy, fill in the api_key values (or leave them out and let the client's own
# Authorization header pass through), and run:
#
#   switchboard --config examples/agent-delegation.toml
#
# NOTE: keys belong in a file that is NOT committed. samples/ is gitignored;
# this file ships with placeholders only.

listen = "127.0.0.1:8900"

# ── providers ────────────────────────────────────────────────────────────
#
# `target` is the concurrency the gate aims to keep in flight. Delegated
# reviews are long and few, so these are deliberately small: the gate exists to
# stop switchboard from being the thing that overloads a provider, not to
# throttle a human.

# Each provider presents its OWN credential. This is not optional for
# cross-vendor failover: a request rerouted from opencode-go to ollama-cloud
# carrying the zen key would be rejected, turning "out of quota" into "401".
# Keys come from the environment so they never land in a committed file.

[provider.opencode-go]
upstream = "https://opencode.ai/zen/go/v1"   # full API root; clients send /chat/completions
type = "generic"
target = 4
api_key_env = "SWITCHBOARD_OPENCODE_GO_KEY"

[provider.ollama-cloud]
upstream = "https://ollama.com/v1"
type = "generic"
target = 4
api_key_env = "SWITCHBOARD_OLLAMA_CLOUD_KEY"

[provider.zai-coding-plan]
upstream = "https://api.z.ai/api/coding/paas/v4"  # no /v1 — see docs/deployment.md
type = "generic"
target = 2
api_key_env = "SWITCHBOARD_ZAI_KEY"

# ── routing ──────────────────────────────────────────────────────────────
#
# Order matters: the first entry is the primary, the rest are failover
# candidates ranked by headroom at decision time. opencode-go/dsv4-flash is the
# effectively-unmetered default, so it leads; ollama-cloud carries the same
# model family and its own generous allotment, so it is the natural second.

[route.default]
providers = ["opencode-go", "ollama-cloud", "zai-coding-plan"]

# ── usage-error reroute ──────────────────────────────────────────────────
#
# The feature that makes a delegated agent survive an exhausted provider: on
# 429/402/503/529, retry once on the next eligible provider before the client
# ever sees a byte. One retry is the right default — it covers "this provider
# is out" without turning a genuinely estate-wide outage into a fan-out.

[reroute]
enabled = true
max_attempts = 1

# ── model bridge ─────────────────────────────────────────────────────────
#
# Providers label the same model differently, so a bare failover would forward
# a name the fallback rejects. Map the names that matter; anything unmapped
# simply never fails over to a provider that cannot serve it.

[model."deepseek-v4-flash"]
opencode-go = "deepseek-v4-flash"
ollama-cloud = "deepseek-v4-flash"

[model."kimi-k3"]
opencode-go = "kimi-k3"
ollama-cloud = "kimi-k3"

[model."glm-5.2"]
opencode-go = "glm-5.2"
ollama-cloud = "glm-5.2"
zai-coding-plan = "glm-5.2"

# ── truth source ─────────────────────────────────────────────────────────
#
# usage-dashboard already tracks claude/claude_work/zai/ollama/codex.
# Providers it covers can get PROACTIVE pressure signals (route away BEFORE
# the client eats an error); providers it does not cover still get the
# reactive [reroute] backstop above, which is why that backstop is
# provider-neutral by design.
#
# These keys are PER PROVIDER, not a top-level [dashboard] table — an
# earlier draft of this file had them at the top level, where they are
# silently ignored. Add them inside the provider they describe:
#
#   [provider.ollama-cloud]
#   dashboard_url = "https://usage.internal.example"
#   dashboard_token_env = "SWITCHBOARD_DASHBOARD_TOKEN"
#   dashboard_provider = "ollama"
#
# dashboard_provider maps this provider to the dashboard's own id when the
# names differ — the dashboard emits "zai" / "ollama" / "opencode" / "codex"
# / "claude", while switchboard route keys are usually longer
# ("zai-coding-plan", "ollama-cloud", "opencode-go"). Without the mapping the
# lookup never matches and the provider silently gets no pressure signal.
#
# ── peak-pricing windows (Plan 025) ──────────────────────────────────────
#
# A provider inside a peak window is DEMOTED in routing (never excluded):
# it serves only when nothing cheaper can take the request, and it never
# enters the pace surplus race. One spec per line: "<days> HH:MM-HH:MM
# <utcoffset>", days = daily | mon | mon-fri | mon,wed,fri; end <= start
# crosses midnight; fixed UTC offsets only.
#
#   [provider.zai-coding-plan]
#   peak_windows = ["mon-fri 14:00-18:00 +08:00"]   # GLM Coding Plan peak
