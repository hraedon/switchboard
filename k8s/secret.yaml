# Provider API keys for switchboard, injected as the environment variables named
# by each provider's `api_key_env` in the config.
#
# TEMPLATE ONLY — no key material is committed. Values are deliberately EMPTY:
# switchboard refuses to start when a declared `api_key_env` variable is absent
# or empty (it will not fall back to forwarding the client's own credential
# upstream), so an unapplied Secret crash-loops the pod loudly with a log line
# naming the missing variable instead of quietly proxying a bogus key. The
# deployment is inert until every value below is replaced.
#
# Populate in place (base64 is applied by kubectl, so the value is the plain
# key):
#
#   kubectl -n switchboard create secret generic switchboard-provider-keys \
#     --from-literal=SWITCHBOARD_OPENCODE_GO_KEY='<key>' \
#     --from-literal=SWITCHBOARD_OLLAMA_CLOUD_KEY='<key>' \
#     --from-literal=SWITCHBOARD_ZAI_KEY='<key>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or edit this file and `kubectl apply -f k8s/secret.yaml`.
#
# Key names must match the `api_key_env` values in k8s/configmap.yaml exactly.
#
# ADMIN TOKEN. `SWITCHBOARD_ADMIN_TOKEN` gates every admin route. It is
# referenced by k8s/deployment.yaml as a secretKeyRef — putting a value here is
# only half the job, because a Secret key nothing references is inert. Mint and
# apply it the same way as the provider keys:
#
#   kubectl -n switchboard patch secret switchboard-provider-keys \
#     --type=merge -p "{\"stringData\":{\"SWITCHBOARD_ADMIN_TOKEN\":\"$(openssl rand -base64 39)\"}}"
#
# Rotation is: patch the value, roll the deployment. Outstanding dashboard
# sessions are revoked automatically — the session cookie is signed with a key
# derived from the token, so changing it invalidates every cookie with no
# server-side state to clear.
apiVersion: v1
kind: Secret
metadata:
  name: switchboard-provider-keys
  namespace: switchboard
  labels:
    app: switchboard
type: Opaque
data:
  SWITCHBOARD_OPENCODE_GO_KEY: ""
  SWITCHBOARD_OLLAMA_CLOUD_KEY: ""
  SWITCHBOARD_ZAI_KEY: ""
