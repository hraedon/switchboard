# Internal-only ingress for switchboard.
#
# switchboard holds EVERY provider credential and, by design, will spend them
# on behalf of whoever asks. It must therefore never be reachable from outside
# the LAN. This is enforced structurally, not by convention: the `traefik-
# internal` ingress class only binds the internal (LAN) ingress controller, and
# cert-manager issues a real certificate for the host below — so if the host
# placeholder is replaced with a public DNS name, the internal class should
# still keep it off the public internet, but DO NOT test that assumption. Keep
# the host on an internal-only DNS name.
#
# The host is the estate's internal name (CNAME to ingress.k8s.hraedon.com in
# the internal zone); cert-manager mints the TLS secret via
# letsencrypt-prod-porkbun DNS-01, so issuance does not require the host to
# resolve publicly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: switchboard
  namespace: switchboard
  labels:
    app: switchboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-porkbun
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik-internal
  tls:
    - hosts:
        - switchboard.k8s.hraedon.com
      secretName: switchboard-k8s-hraedon-com-tls
  rules:
    - host: switchboard.k8s.hraedon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: switchboard
                port:
                  name: http
